<style>

* {

}

body {

.container {

/* =========================

<body>

<div class="container">

    <h1>المحفظة</h1>


    <!-- =========================
         إضافة مستخدم
    ========================== -->

    <div class="form-box">

        <div class="form-title">
            إضافة مستخدم
        </div>


        <div class="form-row">

            <input
                type="text"
                id="username"
                placeholder="اسم المستخدم"
            >

            <input
                type="email"
                id="userEmail"
                placeholder="إيميل المستخدم"
            >

        </div>


        <div class="form-row">

            <input
                type="text"
                id="walletNumber"
                placeholder="رقم المحفظة - أرقام وحروف"
            >

            <input
                type="email"
                id="walletEmail"
                placeholder="إيميل المحفظة"
            >

        </div>


        <div class="form-row">

            <input
                type="number"
                id="balance"
                placeholder="الرصيد"
                step="0.01"
                min="0"
            >

        </div>


        <button
            class="add-btn"
            id="addBtn"
        >
            إضافة المستخدم
        </button>

    </div>


    <!-- =========================
         المستخدمين
    ========================== -->

    <div class="users-box">

        <div class="users-title">
            بيانات المستخدمين
        </div>


        <div id="usersContainer">

            <div class="loading">
                جاري تحميل البيانات...
            </div>

        </div>

    </div>

</div>


<script type="module">


/* =========================
   Firebase
========================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAB4wO937rCwc0OTWeJlGgoaxErWOdjaJM",

    authDomain:
        "my-new-a6e9f.firebaseapp.com",

    databaseURL:
        "https://my-new-a6e9f-default-rtdb.firebaseio.com",

    projectId:
        "my-new-a6e9f",

    storageBucket:
        "my-new-a6e9f.firebasestorage.app",

    messagingSenderId:
        "1034729064842",

    appId:
        "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


/* مكان البيانات */

const walletsRef =
    ref(db, "wallets");


let wallets = {};


/* =========================
   تحميل البيانات
========================= */

onValue(walletsRef, (snapshot) => {

    wallets =
        snapshot.val() || {};

    displayUsers();

});


/* =========================
   زر الإضافة
========================= */

document
    .getElementById("addBtn")
    .addEventListener("click", addUser);


/* =========================
   إضافة مستخدم
========================= */

async function addUser() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const userEmail =
        document
        .getElementById("userEmail")
        .value
        .trim();


    const walletNumber =
        document
        .getElementById("walletNumber")
        .value
        .trim();


    const walletEmail =
        document
        .getElementById("walletEmail")
        .value
        .trim();


    const balanceValue =
        document
        .getElementById("balance")
        .value
        .trim();


    const balance =
        Number(balanceValue);


    if (
        !username ||
        !userEmail ||
        !walletNumber ||
        !walletEmail ||
        balanceValue === "" ||
        isNaN(balance) ||
        balance < 0
    ) {

        alert("اكتب جميع البيانات بشكل صحيح");

        return;

    }


    /* منع تكرار رقم المحفظة */

    const duplicate =
        Object.values(wallets)
        .some(item =>
            String(item.walletNumber).toLowerCase()
            === walletNumber.toLowerCase()
        );


    if (duplicate) {

        alert("رقم المحفظة موجود بالفعل");

        return;

    }


    /* إنشاء مستخدم */

    const newUserRef =
        push(walletsRef);


    await set(newUserRef, {

        username: username,

        userEmail: userEmail,

        walletNumber: walletNumber,

        walletEmail: walletEmail,

        balance: balance,

        createdAt: Date.now()

    });


    /* تنظيف الحقول */

    document.getElementById("username").value = "";

    document.getElementById("userEmail").value = "";

    document.getElementById("walletNumber").value = "";

    document.getElementById("walletEmail").value = "";

    document.getElementById("balance").value = "";

}


/* =========================
   عرض المستخدمين
========================= */

function displayUsers() {

    const container =
        document.getElementById("usersContainer");


    container.innerHTML = "";


    const entries =
        Object.entries(wallets);


    if (entries.length === 0) {

        container.innerHTML = `

            <div class="empty">
                لا توجد بيانات مستخدمين حالياً
            </div>

        `;

        return;

    }


    /* الأحدث أولاً */

    entries.sort((a, b) => {

        return (
            Number(b[1].createdAt || 0) -
            Number(a[1].createdAt || 0)
        );

    });


    entries.forEach(([id, user]) => {

        const card =
            document.createElement("div");


        card.className =
            "user-card";


        card.dataset.id =
            id;


        card.innerHTML = `

            <div class="user-info">

                <div class="info">

                    <div class="info-label">
                        اسم المستخدم
                    </div>

                    <div class="info-value">
                        ${escapeHTML(user.username)}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        إيميل المستخدم
                    </div>

                    <div class="info-value">
                        ${escapeHTML(user.userEmail)}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        رقم المحفظة
                    </div>

                    <div class="info-value wallet-number">
                        ${escapeHTML(user.walletNumber)}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        إيميل المحفظة
                    </div>

                    <div class="info-value">
                        ${escapeHTML(user.walletEmail)}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        الرصيد
                    </div>

                    <div class="info-value balance-value">
                        ${formatBalance(user.balance)}
                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="edit-btn"
                    data-edit="${id}"
                >
                    تعديل
                </button>


                <button
                    class="transfer-btn"
                    data-transfer="${id}"
                >
                    تحويل رصيد
                </button>


                <button
                    class="delete-btn"
                    data-delete="${id}"
                >
                    حذف
                </button>

            </div>

        `;


        container.appendChild(card);

    });


    /* أزرار التعديل */

    container
    .querySelectorAll("[data-edit]")
    .forEach(button => {

        button.addEventListener("click", () => {

            editUser(
                button.dataset.edit
            );

        });

    });


    /* أزرار التحويل */

    container
    .querySelectorAll("[data-transfer]")
    .forEach(button => {

        button.addEventListener("click", () => {

            showTransferForm(
                button.dataset.transfer
            );

        });

    });


    /* أزرار الحذف */

    container
    .querySelectorAll("[data-delete]")
    .forEach(button => {

        button.addEventListener("click", () => {

            deleteUser(
                button.dataset.delete
            );

        });

    });

}


/* =========================
   نموذج تحويل الرصيد
========================= */

function showTransferForm(fromId) {

    const card =
        document.querySelector(
            `.user-card[data-id="${fromId}"]`
        );


    if (!card) return;


    const fromUser =
        wallets[fromId];


    if (!fromUser) return;


    /* لو نموذج التحويل موجود بالفعل */

    if (
        card.querySelector(".transfer-box")
    ) {

        return;

    }


    const transferBox =
        document.createElement("div");


    transferBox.className =
        "transfer-box";


    transferBox.innerHTML = `

        <div class="transfer-title">
            تحويل رصيد من:
            ${escapeHTML(fromUser.username)}
        </div>


        <div class="transfer-info">
            الرصيد الحالي:
            <strong>
                ${formatBalance(fromUser.balance)}
            </strong>
        </div>


        <div class="transfer-row">

            <select id="transferTo_${fromId}">

                <option value="">
                    اختر الحساب المستلم
                </option>

            </select>


            <input
                type="number"
                id="transferAmount_${fromId}"
                placeholder="مبلغ التحويل"
                min="0.01"
                step="0.01"
            >

        </div>


        <div class="transfer-actions">

            <button
                class="confirm-transfer-btn"
                id="confirmTransfer_${fromId}"
            >
                تأكيد التحويل
            </button>


            <button
                class="cancel-transfer-btn"
                id="cancelTransfer_${fromId}"
            >
                إلغاء
            </button>

        </div>

    `;


    card.appendChild(transferBox);


    /* إضافة الحسابات الأخرى */

    const select =
        document.getElementById(
            `transferTo_${fromId}`
        );


    Object.entries(wallets).forEach(
        ([id, user]) => {

            if (id === fromId) {
                return;
            }


            const option =
                document.createElement("option");


            option.value = id;


            option.textContent =
                `${user.username} - ${user.walletNumber} - الرصيد: ${formatBalance(user.balance)}`;


            select.appendChild(option);

        }
    );


    /* تأكيد التحويل */

    document
        .getElementById(`confirmTransfer_${fromId}`)
        .addEventListener("click", () => {

            transferBalance(fromId);

        });


    /* إلغاء */

    document
        .getElementById(`cancelTransfer_${fromId}`)
        .addEventListener("click", () => {

            transferBox.remove();

        });

}


/* =========================
   تنفيذ تحويل الرصيد
========================= */

async function transferBalance(fromId) {

    const toId =
        document
        .getElementById(`transferTo_${fromId}`)
        .value;


    const amountValue =
        document
        .getElementById(`transferAmount_${fromId}`)
        .value
        .trim();


    const amount =
        Number(amountValue);


    /* التحقق */

    if (!toId) {

        alert("اختر الحساب المستلم");

        return;

    }


    if (
        amountValue === "" ||
        isNaN(amount) ||
        amount <= 0
    ) {

        alert("اكتب مبلغ تحويل صحيح");

        return;

    }


    if (fromId === toId) {

        alert("لا يمكن التحويل لنفس الحساب");

        return;

    }


    const fromUser =
        wallets[fromId];


    const toUser =
        wallets[toId];


    if (!fromUser || !toUser) {

        alert("الحساب غير موجود");

        return;

    }


    const fromBalance =
        Number(fromUser.balance || 0);


    const toBalance =
        Number(toUser.balance || 0);


    /* التأكد من الرصيد */

    if (amount > fromBalance) {

        alert(
            "الرصيد غير كافي. الرصيد الحالي: "
            + formatBalance(fromBalance)
        );

        return;

    }


    const newFromBalance =
        fromBalance - amount;


    const newToBalance =
        toBalance + amount;


    /* تأكيد العملية */

    const confirmed =
        confirm(
            "هل تريد تحويل " +
            formatBalance(amount) +
            " من " +
            fromUser.username +
            " إلى " +
            toUser.username +
            "؟"
        );


    if (!confirmed) {

        return;

    }


    try {

        /*
         * تحديث الحسابين معاً
         */

        const updates = {};


        updates[
            "wallets/" +
            fromId +
            "/balance"
        ] = Number(newFromBalance.toFixed(2));


        updates[
            "wallets/" +
            toId +
            "/balance"
        ] = Number(newToBalance.toFixed(2));


        /*
         * تسجيل العملية
         */

        const transferRef =
            push(
                ref(db, "transfers")
            );


        updates[
            "transfers/" +
            transferRef.key
        ] = {

            fromId: fromId,

            fromUsername:
                fromUser.username,

            fromWallet:
                fromUser.walletNumber,

            toId: toId,

            toUsername:
                toUser.username,

            toWallet:
                toUser.walletNumber,

            amount: amount,

            createdAt: Date.now()

        };


        await update(
            ref(db),
            updates
        );


        alert(
            "تم تحويل الرصيد بنجاح"
        );

    } catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء تحويل الرصيد"
        );

    }

}


/* =========================
   تعديل المستخدم
========================= */

function editUser(id) {

    const user =
        wallets[id];


    if (!user) return;


    const card =
        document.querySelector(
            `.user-card[data-id="${id}"]`
        );


    card.innerHTML = `

        <div class="edit-form">

            <input
                type="text"
                id="editUsername_${id}"
                value="${escapeAttribute(user.username)}"
                placeholder="اسم المستخدم"
            >


            <input
                type="email"
                id="editUserEmail_${id}"
                value="${escapeAttribute(user.userEmail)}"
                placeholder="إيميل المستخدم"
            >


            <input
                type="text"
                id="editWalletNumber_${id}"
                value="${escapeAttribute(user.walletNumber)}"
                placeholder="رقم المحفظة"
            >


            <input
                type="email"
                id="editWalletEmail_${id}"
                value="${escapeAttribute(user.walletEmail)}"
                placeholder="إيميل المحفظة"
            >


            <input
                type="number"
                id="editBalance_${id}"
                value="${Number(user.balance || 0)}"
                placeholder="الرصيد"
                step="0.01"
                min="0"
            >


            <div class="edit-actions">

                <button
                    class="save-btn"
                    id="save_${id}"
                >
                    حفظ التعديل
                </button>


                <button
                    class="cancel-btn"
                    id="cancel_${id}"
                >
                    إلغاء
                </button>

            </div>

        </div>

    `;


    document
        .getElementById(`save_${id}`)
        .addEventListener("click", () => {

            saveEdit(id);

        });


    document
        .getElementById(`cancel_${id}`)
        .addEventListener("click", () => {

            displayUsers();

        });

}


/* =========================
   حفظ التعديل
========================= */

async function saveEdit(id) {

    const username =
        document
        .getElementById(`editUsername_${id}`)
        .value
        .trim();


    const userEmail =
        document
        .getElementById(`editUserEmail_${id}`)
        .value
        .trim();


    const walletNumber =
        document
        .getElementById(`editWalletNumber_${id}`)
        .value
        .trim();


    const walletEmail =
        document
        .getElementById(`editWalletEmail_${id}`)
        .value
        .trim();


    const balanceValue =
        document
        .getElementById(`editBalance_${id}`)
        .value
        .trim();


    const balance =
        Number(balanceValue);


    if (
        !username ||
        !userEmail ||
        !walletNumber ||
        !walletEmail ||
        balanceValue === "" ||
        isNaN(balance) ||
        balance < 0
    ) {

        alert(
            "اكتب جميع البيانات بشكل صحيح"
        );

        return;

    }


    /* منع تكرار رقم المحفظة */

    const duplicate =
        Object.entries(wallets)
        .some(([otherId, item]) => {

            if (otherId === id) {

                return false;

            }

            return String(
                item.walletNumber
            ).toLowerCase()
            === walletNumber.toLowerCase();

        });


    if (duplicate) {

        alert(
            "رقم المحفظة مستخدم بالفعل"
        );

        return;

    }


    await update(
        ref(db, "wallets/" + id),
        {

            username: username,

            userEmail: userEmail,

            walletNumber: walletNumber,

            walletEmail: walletEmail,

            balance: balance

        }
    );


    alert(
        "تم حفظ التعديل"
    );

}


/* =========================
   حذف المستخدم
========================= */

async function deleteUser(id) {

    const confirmed =
        confirm(
            "هل تريد حذف هذا المستخدم؟"
        );


    if (!confirmed) {

        return;

    }


    await remove(
        ref(db, "wallets/" + id)
    );


    alert(
        "تم حذف المستخدم"
    );

}


/* =========================
   تنسيق الرصيد
========================= */

function formatBalance(value) {

    const number =
        Number(value || 0);


    return number.toFixed(2);

}


/* =========================
   حماية النص
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        String(text ?? "");


    return div.innerHTML;

}


/* =========================
   حماية input
========================= */

function escapeAttribute(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}
