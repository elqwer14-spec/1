<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    get,
    onValue,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* Firebase */

const firebaseConfig = {

    apiKey:
        "AIzaSyAB4wO937rCwc0OTWeJlGgoaxErWOdjaJM",

    authDomain:
        "my-new-a6e9f.firebaseapp.com",

    databaseURL:
        "https://my-new-a6e9f-default-rtdb.firebaseio.com",

    projectId:
        "my-new-a6e9f",

    storageBucket:
        "my-new-a6e9f.firebasestorage.app",

    messagingSenderId:
        "1034729064842",

    appId:
        "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* البيانات */

let links = {};
let users = {};
let currentUser = "";
let editingLinkId = null;


/* المراجع */

const linksRef =
    ref(db, "links");

const usersRef =
    ref(db, "users");


/* فتح وغلق إضافة البيانات */

const addTitle =
    document.getElementById("addTitle");

const addContent =
    document.getElementById("addContent");

addTitle.addEventListener(
    "click",
    () => {

        addContent.classList.toggle("open");

        addTitle.classList.toggle("open");

    }
);


/* تحميل اللينكات */

onValue(
    linksRef,
    snapshot => {

        links =
            snapshot.val() || {};

        displayLinks();

    }
);


/* تحميل المستخدمين */

onValue(
    usersRef,
    snapshot => {

        users =
            snapshot.val() || {};

        updateUserUI();

        displayLinks();

    }
);


/* تسجيل الدخول */

document
    .getElementById("loginBtn")
    .addEventListener(
        "click",
        loginUser
    );


async function loginUser() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    if (!username) {

        alert(
            "اكتب اسم المستخدم أولاً"
        );

        return;
    }

    const userKey =
        makeUserKey(username);

    currentUser =
        userKey;


    /* حفظ آخر مستخدم */

    await set(
        ref(db, "lastUser"),
        {
            username: username,
            loginTime: Date.now()
        }
    );


    /* إنشاء المستخدم */

    const userRef =
        ref(
            db,
            "users/" + userKey
        );

    const snapshot =
        await get(userRef);


    if (!snapshot.exists()) {

        await set(
            userRef,
            {
                username: username,
                visited: {}
            }
        );

    }


    updateUserUI();

    displayLinks();

}


/* تحديث المستخدم */

function updateUserUI() {

    const usernameInput =
        document.getElementById(
            "username"
        );

    const loginBtn =
        document.getElementById(
            "loginBtn"
        );

    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );

    const status =
        document.getElementById(
            "userStatus"
        );


    if (!currentUser) {

        usernameInput.disabled = false;

        loginBtn.style.display =
            "block";

        logoutBtn.style.display =
            "none";

        status.innerHTML =
            "لم يتم تسجيل أي مستخدم";

        return;
    }


    usernameInput.disabled = true;

    loginBtn.style.display =
        "none";

    logoutBtn.style.display =
        "block";


    const user =
        users[currentUser];


    if (!user) {

        status.innerHTML =
            "تم تسجيل الدخول";

        return;
    }


    const visited =
        user.visited || {};

    const count =
        Object.keys(visited).length;


    if (count === 0) {

        status.innerHTML =
            `المستخدم
            <b>${escapeHTML(user.username)}</b>
            لم يدخل على أي لينك حتى الآن.`;

    } else {

        status.innerHTML =
            `المستخدم
            <b>${escapeHTML(user.username)}</b>
            دخل على
            <b>${count}</b>
            لينك.`;

    }

}


/* تسجيل الخروج */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        logoutUser
    );


function logoutUser() {

    currentUser = "";

    document
        .getElementById("username")
        .value = "";

    editingLinkId = null;

    updateUserUI();

    displayLinks();

}


/* إضافة لينك */

document
    .getElementById("addBtn")
    .addEventListener(
        "click",
        addLink
    );


async function addLink() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const url =
        document
            .getElementById("url")
            .value
            .trim();

    const price =
        document
            .getElementById("price")
            .value
            .trim();

    const order =
        document
            .getElementById("order")
            .value
            .trim();

    const notes =
        document
            .getElementById("notes")
            .value
            .trim();


    if (
        !name &&
        !url &&
        !price &&
        !order &&
        !notes
    ) {

        alert(
            "اكتب أي بيانات تريد إضافتها"
        );

        return;
    }


    /* منع تكرار الرابط */

    if (url) {

        const exists =
            Object
                .values(links)
                .some(
                    item =>
                        item.url === url
                );


        if (exists) {

            alert(
                "هذا اللينك موجود بالفعل"
            );

            return;
        }

    }


    const priceNumber =
        price
            ? Number(price)
            : null;

    const orderNumber =
        order
            ? Number(order)
            : null;


    const batchId =
        "batch_" + Date.now();


    const newLinkRef =
        push(linksRef);


    await set(
        newLinkRef,
        {
            name: name,
            url: url,
            price: priceNumber,
            order: orderNumber,
            notes: notes,
            createdAt: Date.now(),
            batchId: batchId
        }
    );


    /* تنظيف الفورم */

    document.getElementById("name").value = "";
    document.getElementById("url").value = "";
    document.getElementById("price").value = "";
    document.getElementById("order").value = "";
    document.getElementById("notes").value = "";

}


/* البحث */

document
    .getElementById("searchOrder")
    .addEventListener(
        "input",
        displayLinks
    );


/* عرض اللينكات */

function displayLinks() {

    const container =
        document.getElementById(
            "linksContainer"
        );

    container.innerHTML = "";


    let entries =
        Object.entries(links);


    const searchValue =
        document
            .getElementById("searchOrder")
            .value
            .trim();


    /* البحث */

    if (searchValue) {

        entries =
            entries.filter(
                ([id, item]) => {

                    return String(
                        item.order
                    ) === searchValue;

                }
            );

    }


    /* الترتيب */

    entries.sort(
        (a, b) => {

            const itemA = a[1];
            const itemB = b[1];


            const orderA =
                itemA.order === null ||
                itemA.order === undefined ||
                itemA.order === ""
                    ? Infinity
                    : Number(itemA.order);


            const orderB =
                itemB.order === null ||
                itemB.order === undefined ||
                itemB.order === ""
                    ? Infinity
                    : Number(itemB.order);


            if (orderA !== orderB) {

                return orderA - orderB;

            }


            return (
                Number(itemA.createdAt || 0) -
                Number(itemB.createdAt || 0)
            );

        }
    );


    /* لا يوجد بيانات */

    if (entries.length === 0) {

        container.innerHTML =
            searchValue

                ? `<div class="empty">
                    لا يوجد لينك ترتيبه
                    ${escapeHTML(searchValue)}
                   </div>`

                : `<div class="empty">
                    لا توجد لينكات حالياً
                   </div>`;

        return;
    }


    /* إنشاء الكروت */

    entries.forEach(
        ([linkId, item], index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "link-item";


            const user =
                currentUser
                    ? users[currentUser]
                    : null;


            const visited =
                user &&
                user.visited &&
                user.visited[linkId];


            let statusHTML;


            if (!currentUser) {

                statusHTML =
                    `<div class="status no-user">
                        👤 بدون تسجيل دخول
                     </div>`;

            } else if (visited) {

                statusHTML =
                    `<div class="status visited">
                        🟢 تم الدخول
                     </div>`;

            } else {

                statusHTML =
                    `<div class="status not-visited">
                        ⚪ لم يتم الدخول
                     </div>`;

            }


            let infoHTML = "";


            /* الاسم */

            if (item.name) {

                infoHTML +=
                    `<div class="link-name">
                        ${escapeHTML(item.name)}
                     </div>`;

            }


            /* الرابط */

            if (item.url) {

                infoHTML +=
                    `<div class="link-info">

                        <a
                            href="${escapeHTML(item.url)}"
                            target="_blank"
                            rel="noopener"
                            data-link-id="${linkId}"
                        >
                            ${escapeHTML(item.url)}
                        </a>

                     </div>`;

            }


            /* الملاحظات */

            if (item.notes) {

                infoHTML +=
                    `<div class="link-notes">
                        ${escapeHTML(item.notes)}
                     </div>`;

            }


            /* الكارت */

            div.innerHTML = `

                <div class="number">
                    ${index + 1}
                </div>


                <div>
                    ${infoHTML}
                </div>


                <div>

                    ${
                        item.price !== null &&
                        item.price !== undefined
                            ? `<div class="price">
                                ${escapeHTML(item.price)}
                               </div>`
                            : ""
                    }


                    ${
                        item.order !== null &&
                        item.order !== undefined
                            ? `<div class="order">
                                ترتيب:
                                ${escapeHTML(item.order)}
                               </div>`
                            : ""
                    }


                    ${statusHTML}

                </div>


                <div>

                    <button
                        class="edit-btn"
                        data-edit-id="${linkId}"
                    >
                        تعديل
                    </button>


                    <button
                        class="delete-btn"
                        data-delete-id="${linkId}"
                    >
                        حذف
                    </button>

                </div>

            `;


            container.appendChild(div);


            /* لو الكارت ده هو اللي بيتعدل */

            if (editingLinkId === linkId) {

                showEditForm(
                    div,
                    linkId,
                    item
                );

            }

        }
    );


    /* فتح الرابط */

    container
        .querySelectorAll(
            "a[data-link-id]"
        )
        .forEach(
            link => {

                link.addEventListener(
                    "click",
                    () => {

                        markVisited(
                            link.dataset.linkId
                        );

                    }
                );

            }
        );


    /* زر التعديل */

    container
        .querySelectorAll(
            "[data-edit-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const id =
                            button.dataset.editId;


                        if (
                            editingLinkId === id
                        ) {

                            editingLinkId =
                                null;

                        } else {

                            editingLinkId =
                                id;

                        }


                        displayLinks();

                    }
                );

            }
        );


    /* زر الحذف */

    container
        .querySelectorAll(
            "[data-delete-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteLink(
                            button.dataset.deleteId
                        );

                    }
                );

            }
        );

}


/* إظهار مربع التعديل */

function showEditForm(
    div,
    linkId,
    item
) {

    const editBox =
        document.createElement(
            "div"
        );

    editBox.className =
        "edit-box";


    editBox.innerHTML = `

        <div class="edit-box-title">
            تعديل بيانات اللينك
        </div>


        <div class="edit-form-row">

            <input
                type="text"
                id="edit-name-${linkId}"
                value="${escapeAttribute(item.name || "")}"
                placeholder="الاسم"
            >

            <input
                type="url"
                id="edit-url-${linkId}"
                value="${escapeAttribute(item.url || "")}"
                placeholder="الرابط"
            >

        </div>


        <div class="edit-form-row">

            <input
                type="number"
                id="edit-price-${linkId}"
                value="${
                    item.price !== null &&
                    item.price !== undefined
                        ? escapeAttribute(item.price)
                        : ""
                }"
                placeholder="السعر"
            >

            <input
                type="number"
                id="edit-order-${linkId}"
                value="${
                    item.order !== null &&
                    item.order !== undefined
                        ? escapeAttribute(item.order)
                        : ""
                }"
                placeholder="رقم الترتيب"
            >

        </div>


        <textarea
            id="edit-notes-${linkId}"
            placeholder="ملاحظات"
        >${escapeHTML(item.notes || "")}</textarea>


        <button
            class="save-edit-btn"
            data-save-edit="${linkId}"
        >
            حفظ التعديل
        </button>


        <button
            class="cancel-edit-btn"
            data-cancel-edit="${linkId}"
        >
            إلغاء
        </button>

    `;


    div.appendChild(editBox);


    /* حفظ */

    editBox
        .querySelector(
            "[data-save-edit]"
        )
        .addEventListener(
            "click",
            () => {

                saveEdit(linkId);

            }
        );


    /* إلغاء */

    editBox
        .querySelector(
            "[data-cancel-edit]"
        )
        .addEventListener(
            "click",
            () => {

                editingLinkId = null;

                displayLinks();

            }
        );

}


/* حفظ التعديل */

async function saveEdit(linkId) {

    const name =
        document
            .getElementById(
                "edit-name-" + linkId
            )
            .value
            .trim();


    const url =
        document
            .getElementById(
                "edit-url-" + linkId
            )
            .value
            .trim();


    const price =
        document
            .getElementById(
                "edit-price-" + linkId
            )
            .value
            .trim();


    const order =
        document
            .getElementById(
                "edit-order-" + linkId
            )
            .value
            .trim();


    const notes =
        document
            .getElementById(
                "edit-notes-" + linkId
            )
            .value
            .trim();


    /* منع تكرار الرابط */

    if (url) {

        const exists =
            Object
                .entries(links)
                .some(
                    ([id, item]) => {

                        return (
                            id !== linkId &&
                            item.url === url
                        );

                    }
                );


        if (exists) {

            alert(
                "هذا اللينك موجود بالفعل"
            );

            return;

        }

    }


    const priceValue =
        price !== ""
            ? Number(price)
            : null;


    const orderValue =
        order !== ""
            ? Number(order)
            : null;


    /* حفظ في Firebase */

    await update(
        ref(
            db,
            "links/" + linkId
        ),
        {

            name: name,

            url: url,

            price: priceValue,

            order: orderValue,

            notes: notes

        }
    );


    /* إغلاق التعديل */

    editingLinkId = null;

    displayLinks();

}

async function markVisited(linkId) {

    if (!currentUser) {
        return;
    }


    const visitedRef =
        ref(
            db,
            "users/" +
            currentUser +
            "/visited/" +
            linkId
        );


    await set(
        visitedRef,
        true
    );

}

/* User Key */

function makeUserKey(username) {

    return username
        .trim()
        .toLowerCase()
        .replace(
            /[.#$[\]/]/g,
            "_"
        )
        .replace(
            /\s+/g,
            "_"
        );

}


/* حماية HTML */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text ?? "");

    return div.innerHTML;

}


/* حماية Attribute */

function escapeAttribute(text) {

    return String(text ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}
