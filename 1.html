<body>


<div class="container">


    <h1>إدارة اللينكات</h1>


    <!-- المستخدم -->

    <div class="user-box">

        <h2>المستخدم الحالي</h2>

        <div class="user-row">

            <input
                type="text"
                id="username"
                placeholder="اكتب اسم المستخدم"
            >

            <button
                class="user-btn"
                id="loginBtn"
            >
                دخول
            </button>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                خروج
            </button>

        </div>

        <div
            class="user-status"
            id="userStatus"
        >
            لم يتم تسجيل أي مستخدم
        </div>

    </div>



    <!-- إضافة لينك -->

    <div class="add-box">

        <h2>إضافة بيانات</h2>

        <div class="form-row">

            <input
                type="text"
                id="name"
                placeholder="اسم اللينك - اختياري"
            >

            <input
                type="url"
                id="url"
                placeholder="اللينك - اختياري"
            >

        </div>


        <div class="form-row">

            <input
                type="number"
                id="price"
                placeholder="السعر - اختياري"
                step="any"
                min="0"
            >

            <input
                type="number"
                id="order"
                placeholder="الترتيب - اختياري"
                step="1"
                min="1"
            >

        </div>


        <div class="form-row">

            <textarea
                id="notes"
                placeholder="ملاحظات - اختياري"
            ></textarea>

        </div>


        <button
            class="add-btn"
            id="addBtn"
        >
            + إضافة
        </button>

    </div>



    <!-- اللينكات -->

    <div class="links-box">

        <h2>اللينكات</h2>

        <div
            id="linksContainer"
            class="loading"
        >
            جاري تحميل اللينكات...
        </div>

    </div>


</div>



<script type="module">


/* Firebase */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    get,
    onValue,
    update,
    remove
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";



/* Firebase Config */

const firebaseConfig = {

    apiKey:
        "AIzaSyAB4wO937rCwc0OTWeJlGgoaxErWOdjaJM",

    authDomain:
        "my-new-a6e9f.firebaseapp.com",

    databaseURL:
        "https://my-new-a6e9f-default-rtdb.firebaseio.com",

    projectId:
        "my-new-a6e9f",

    storageBucket:
        "my-new-a6e9f.firebasestorage.app",

    messagingSenderId:
        "1034729064842",

    appId:
        "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"

};



/* تشغيل Firebase */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);



/* المتغيرات */

let links = {};

let users = {};

let currentUser = "";



/* مراجع Firebase */

const linksRef =
    ref(db, "links");

const usersRef =
    ref(db, "users");



/* تحميل اللينكات */

onValue(
    linksRef,
    (snapshot) => {

        links =
            snapshot.val() || {};

        displayLinks();

    }
);



/* تحميل المستخدمين */

onValue(
    usersRef,
    (snapshot) => {

        users =
            snapshot.val() || {};

        updateUserUI();

        displayLinks();

    }
);



/* دخول المستخدم */

document
.getElementById("loginBtn")
.addEventListener(
    "click",
    loginUser
);



async function loginUser() {

    const input =
        document.getElementById("username");

    const username =
        input.value.trim();

    if (!username) {

        alert(
            "اكتب اسم المستخدم أولاً"
        );

        return;
    }


    const userKey =
        makeUserKey(username);

    currentUser =
        userKey;


    const userRef =
        ref(
            db,
            "users/" + userKey
        );


    const snapshot =
        await get(userRef);


    if (!snapshot.exists()) {

        await set(
            userRef,
            {
                username: username,
                visited: {}
            }
        );

    }


    updateUserUI();

    displayLinks();

}



/* تحديث بيانات المستخدم */

function updateUserUI() {

    const input =
        document.getElementById("username");

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const status =
        document.getElementById("userStatus");


    if (!currentUser) {

        input.disabled = false;

        loginBtn.style.display =
            "block";

        logoutBtn.style.display =
            "none";

        status.innerHTML =
            "لم يتم تسجيل أي مستخدم";

        return;
    }


    const user =
        users[currentUser];


    input.value =
        user?.username || "";

    input.disabled = true;

    loginBtn.style.display =
        "none";

    logoutBtn.style.display =
        "block";


    const visited =
        user?.visited
        ?
        Object.keys(user.visited)
        :
        [];


    if (visited.length === 0) {

        status.innerHTML =

            `المستخدم
            <b>${escapeHTML(user.username)}</b>
            لم يدخل على أي لينك حتى الآن.`;

    }

    else {

        status.innerHTML =

            `المستخدم
            <b>${escapeHTML(user.username)}</b>
            دخل على
            <b>${visited.length}</b>
            لينك.`;

    }

}



/* خروج */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    logoutUser
);


function logoutUser() {

    currentUser = "";

    document
    .getElementById("username")
    .value = "";

    updateUserUI();

    displayLinks();

}



/* إضافة لينك */

document
.getElementById("addBtn")
.addEventListener(
    "click",
    addLink
);



async function addLink() {

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const url =
        document
        .getElementById("url")
        .value
        .trim();


    const price =
        document
        .getElementById("price")
        .value
        .trim();


    const orderValue =
        document
        .getElementById("order")
        .value
        .trim();


    const notes =
        document
        .getElementById("notes")
        .value
        .trim();



    /*
       لازم يدخل أي بيانات
    */

    if (
        !name &&
        !url &&
        !price &&
        !orderValue &&
        !notes
    ) {

        alert(
            "اكتب أي بيانات تريد إضافتها"
        );

        return;

    }



    /*
       منع تكرار نفس اللينك
    */

    if (url) {

        const duplicate =
            Object.values(links)
            .some(
                item => item.url === url
            );


        if (duplicate) {

            alert(
                "هذا اللينك موجود بالفعل"
            );

            return;

        }

    }



    /*
       تحويل السعر والترتيب لأرقام
    */

    const priceNumber =
        price
        ?
        Number(price)
        :
        null;


    const orderNumber =
        orderValue
        ?
        Number(orderValue)
        :
        null;



    /*
       إنشاء ID
    */

    const newLinkRef =
        push(linksRef);


    await set(
        newLinkRef,
        {

            name: name,

            url: url,

            price: priceNumber,

            order: orderNumber,

            notes: notes,

            createdAt:
                Date.now()

        }
    );



    /*
       تنظيف الحقول
    */

    document
    .getElementById("name")
    .value = "";

    document
    .getElementById("url")
    .value = "";

    document
    .getElementById("price")
    .value = "";

    document
    .getElementById("order")
    .value = "";

    document
    .getElementById("notes")
    .value = "";

}



/* عرض اللينكات */

function displayLinks() {

    const container =
        document.getElementById(
            "linksContainer"
        );


    container.innerHTML = "";


    /*
       تحويل Firebase إلى Array
       ثم الترتيب من الأصغر للأكبر
    */

    const linkEntries =
        Object.entries(links);


    linkEntries.sort(
        ([idA, itemA], [idB, itemB]) => {

            /*
               اللينك الذي ليس له ترتيب
               يظهر في النهاية
            */

            const orderA =
                itemA.order !== null &&
                itemA.order !== undefined &&
                itemA.order !== ""
                ?
                Number(itemA.order)
                :
                Infinity;


            const orderB =
                itemB.order !== null &&
                itemB.order !== undefined &&
                itemB.order !== ""
                ?
                Number(itemB.order)
                :
                Infinity;


            if (orderA !== orderB) {

                return orderA - orderB;

            }


            /*
               لو نفس الترتيب
               الأقدم يظهر أولاً
            */

            return (
                Number(itemA.createdAt || 0)
                -
                Number(itemB.createdAt || 0)
            );

        }
    );



    if (linkEntries.length === 0) {

        container.innerHTML =

            `<div class="empty">
                لا توجد لينكات حالياً
            </div>`;

        return;

    }



    linkEntries.forEach(
        ([linkId, item], index) => {


            let statusHTML;



            /*
               بدون مستخدم
            */

            if (!currentUser) {

                statusHTML =

                    `<div class="status no-user">

                        👤 بدون تسجيل دخول

                    </div>`;

            }

            else {

                const user =
                    users[currentUser];


                const visited =
                    user
                    &&
                    user.visited
                    &&
                    user.visited[linkId];


                if (visited) {

                    statusHTML =

                        `<div class="status visited">

                            🟢 تم الدخول

                        </div>`;

                }

                else {

                    statusHTML =

                        `<div class="status not-visited">

                            ⚪ لم يتم الدخول

                        </div>`;

                }

            }



            const div =
                document.createElement("div");


            div.className =
                "link-item";



            div.innerHTML = `


                <div class="number">

                    ${index + 1}

                </div>



                <div class="link-info">


                    ${
                        item.name

                        ?

                        `<div class="link-name">

                            ${escapeHTML(item.name)}

                        </div>`

                        :

                        ""
                    }



                    ${
                        item.url

                        ?

                        `<a
                            href="${escapeHTML(item.url)}"
                            target="_blank"
                            data-link-id="${linkId}"
                        >

                            ${escapeHTML(item.url)}

                        </a>`

                        :

                        ""
                    }



                    ${
                        item.notes

                        ?

                        `<div class="link-notes">

                            ${escapeHTML(item.notes)}

                        </div>`

                        :

                        ""
                    }


                </div>



                <div>

                    ${
                        item.price !== null &&
                        item.price !== undefined &&
                        item.price !== ""

                        ?

                        `<div class="price">

                            💰 ${escapeHTML(String(item.price))}

                        </div>`

                        :

                        ""
                    }


                    ${
                        item.order !== null &&
                        item.order !== undefined &&
                        item.order !== ""

                        ?

                        `<div class="order">

                            ترتيب: ${escapeHTML(String(item.order))}

                        </div>`

                        :

                        ""
                    }

                </div>



                ${statusHTML}



                <button
                    class="delete-btn"
                    data-delete-id="${linkId}"
                >

                    حذف

                </button>

            `;



            /*
               الضغط على اللينك
            */

            const linkElement =
                div.querySelector(
                    "[data-link-id]"
                );


            if (linkElement) {

                linkElement.addEventListener(
                    "click",
                    () => {

                        markVisited(linkId);

                    }
                );

            }



            /*
               زر الحذف
            */

            const deleteButton =
                div.querySelector(
                    "[data-delete-id]"
                );


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteLink(linkId);

                }
            );


            container.appendChild(div);

        }
    );

}



/* تسجيل دخول المستخدم على اللينك */

async function markVisited(linkId) {

    if (!currentUser) {

        return;

    }


    const visitedRef =
        ref(
            db,
            "users/"
            + currentUser
            + "/visited/"
            + linkId
        );


    await set(
        visitedRef,
        true
    );

}



/* حذف لينك */

async function deleteLink(linkId) {

    if (
        !confirm(
            "هل تريد حذف هذا اللينك؟"
        )
    ) {

        return;

    }


    const linkRef =
        ref(
            db,
            "links/" + linkId
        );


    await remove(linkRef);



    /*
       حذف تسجيل اللينك من جميع المستخدمين
    */

    const updates = {};


    Object.keys(users)
    .forEach(
        username => {

            updates[
                "users/"
                + username
                + "/visited/"
                + linkId
            ] = null;

        }
    );


    if (
        Object.keys(updates).length
    ) {

        await update(
            ref(db),
            updates
        );

    }

}



/* Firebase Key للمستخدم */

function makeUserKey(username) {

    return username

        .trim()

        .toLowerCase()

        .replace(
            /[.#$[\]/]/g,
            "_"
        )

        .replace(
            /\s+/g,
            "_"
        );

}



/* حماية HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


</script>


</body>

</html>
