<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العملاء</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #222;
        }

        /* ================= NAV ================= */

        .top-nav {
            background: #ffffff;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(60, 120, 180, 0.08);
        }

        .top-nav a {
            color: #2878c8;
            text-decoration: none;
            background: #eef7ff;
            border: 1px solid #cfe7fb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .top-nav a:hover {
            background: #dcefff;
            color: #1764a8;
            border-color: #b9dbf5;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* ================= FORM ================= */

        .form-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6daee5;
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        /* ================= CHECK NAME ================= */

        .check-result {
            margin-top: 5px;
            padding: 7px 9px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }

        .check-available {
            display: block;
            background: #e7f7ed;
            color: #157347;
            border: 1px solid #b9e4ca;
        }

        .check-exists {
            display: block;
            background: #fde8e8;
            color: #b42318;
            border: 1px solid #f2b8b5;
        }

        .check-searching {
            display: block;
            background: #eef7ff;
            color: #2878c8;
            border: 1px solid #cfe7fb;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #4d9bd6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #378ac8;
        }

        .add-btn:disabled {
            background: #b7c5d1;
            cursor: not-allowed;
        }

        /* ================= STATUS SUMMARY ================= */

        .status-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .status-summary-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status-box {
            border: 1px solid #e1e8ef;
            border-radius: 7px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .status-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .status-header:hover {
            opacity: 0.9;
        }

        .status-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-arrow {
            font-size: 12px;
            transition: 0.2s;
        }

        .status-box.open .status-arrow {
            transform: rotate(90deg);
        }

        .waiting-header {
            background: #fff8df;
            color: #856404;
        }

        .done-header {
            background: #e5f5ed;
            color: #176b48;
        }

        .reject-header {
            background: #fdebec;
            color: #842029;
        }

        .status-count {
            background: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            min-width: 25px;
            text-align: center;
        }

        .status-list {
            display: none;
            padding: 8px;
            background: #fff;
        }

        .status-box.open .status-list {
            display: block;
        }

        .status-user {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-user:last-child {
            border-bottom: none;
        }

        .status-user-info {
            flex: 1;
            min-width: 180px;
        }

        .status-user-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .status-user-link {
            color: #2878c8;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
            display: block;
        }

        .status-user-link:hover {
            text-decoration: underline;
        }

        .status-user-notes {
            margin-top: 5px;
            font-size: 12px;
            color: #495057;
            background: #f1f8f5;
            padding: 5px 8px;
            border-radius: 4px;
            border-right: 3px solid #198754;
            white-space: pre-wrap;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
        }

        .btn-quick-done {
            background: #198754;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-done:hover {
            background: #146c43;
        }

        .btn-quick-reject {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-reject:hover {
            background: #b22a37;
        }

        .btn-quick-notes {
            background: #0dcaf0;
            color: #212529;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-notes:hover {
            background: #31d2f2;
        }

        .no-status-users {
            color: #888;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }

        /* ================= CLIENTS ================= */

        .clients-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .clients-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* ================= SEARCH ================= */

        .client-search {
            background: #f5f9fd;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .client-search input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .client-search input:focus {
            outline: none;
            border-color: #6daee5;
        }

        /* ================= CLIENT CARD ================= */

        .client-card {
            border: 1px solid #dce5ed;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fff;
        }

        .client-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .client-link {
            display: block;
            color: #2878c8;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .client-link:hover {
            text-decoration: underline;
        }

        .client-notes {
            font-size: 13px;
            color: #555;
            margin-top: 7px;
            white-space: pre-wrap;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
            border-right: 3px solid #2878c8;
        }

        /* ================= STATUS ================= */

        .client-status {
            display: inline-block;
            margin: 5px 0 8px 0;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-done {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-reject {
            background: #f8d7da;
            color: #842029;
        }

        .status-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 7px;
        }

        /* ================= ACTIONS ================= */

        .actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .actions button {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        .edit-btn {
            background: #4d9bd6;
        }

        .edit-btn:hover {
            background: #378ac8;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .save-btn {
            background: #198754;
        }

        .cancel-btn {
            background: #6c757d;
        }

        /* ================= EDIT ================= */

        .edit-content input,
        .edit-content textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .edit-content textarea {
            min-height: 70px;
            resize: vertical;
        }

        .edit-actions {
            display: flex;
            gap: 7px;
        }

        .edit-actions button {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        /* ================= EMPTY ================= */

        .loading,
        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .top-nav {
                padding: 8px;
            }

            .top-nav a {
                font-size: 11px;
                padding: 7px 8px;
            }

            .container {
                margin-top: 12px;
            }
        }
    </style>

</head>

<body>

    <!-- ================= NAV ================= -->

    <div class="top-nav">
        <a href="https://elqwer14-spec.github.io/1/1.html">1. Data_Entry_links_Users</a>
        <a href="https://elqwer14-spec.github.io/1/2.html">2. Data_Users</a>
        <a href="https://elqwer14-spec.github.io/1/3.html">3. Last_add</a>
        <a href="https://elqwer14-spec.github.io/1/4.html">4. Wallet</a>
        <a href="https://elqwer14-spec.github.io/1/5.html">5. Clients</a>
        <a href="https://elqwer14-spec.github.io/1/6.html">6. not_done_for_User</a>
        <a href="https://elqwer14-spec.github.io/1/7.html">7. last_login</a>
        <a href="https://elqwer14-spec.github.io/1/8.html">8. Search</a>
    </div>

    <div class="container">

        <!-- ================= ADD CLIENT ================= -->

        <div class="form-box">
            <div class="form-title">إضافة عميل</div>

            <div class="form-group">
                <label>اسم العميل</label>
                <input type="text" id="clientName" placeholder="اكتب اسم العميل" autocomplete="off" oninput="checkNameAvailability()">
                <div id="nameCheck" class="check-result"></div>
            </div>

            <div class="form-group">
                <label>لينك العميل</label>
                <input type="text" id="clientLink" placeholder="https://example.com" autocomplete="off" oninput="checkLinkAvailability()">
                <div id="linkCheck" class="check-result"></div>
            </div>

            <div class="form-group">
                <label>الحالة</label>
                <select id="clientStatus">
                    <option value="waiting">⏳ على الانتظار</option>
                    <option value="done">✅ done</option>
                    <option value="reject">❌ recject</option>
                </select>
            </div>

            <div class="form-group">
                <label>ملاحظات</label>
                <textarea id="clientNotes" placeholder="اكتب ملاحظات..."></textarea>
            </div>

            <button class="add-btn" id="addBtn" onclick="addClient()">إضافة العميل</button>
        </div>

        <!-- ================= STATUS SUMMARY ================= -->

        <div class="status-summary">
            <div class="status-summary-title">حالات العملاء</div>

            <div class="status-box" id="waitingBox">
                <div class="status-header waiting-header" onclick="toggleStatus('waitingBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>⏳ على الانتظار</span>
                    </div>
                    <span class="status-count" id="waitingCount">0</span>
                </div>
                <div class="status-list" id="waitingList"></div>
            </div>

            <div class="status-box" id="doneBox">
                <div class="status-header done-header" onclick="toggleStatus('doneBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>✅ done</span>
                    </div>
                    <span class="status-count" id="doneCount">0</span>
                </div>
                <div class="status-list" id="doneList"></div>
            </div>

            <div class="status-box" id="rejectBox">
                <div class="status-header reject-header" onclick="toggleStatus('rejectBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>❌ recject</span>
                    </div>
                    <span class="status-count" id="rejectCount">0</span>
                </div>
                <div class="status-list" id="rejectList"></div>
            </div>

        </div>

        <!-- ================= CLIENTS ================= -->

        <div class="clients-box">
            <div class="clients-title">قائمة العملاء</div>

            <div class="client-search">
                <input type="text" id="clientSearch" placeholder="🔎 ابحث عن عميل..." autocomplete="off" oninput="displayClients()">
            </div>

            <div id="clientsContainer">
                <div class="loading">جاري تحميل العملاء...</div>
            </div>
        </div>

    </div>

    <!-- ================= FIREBASE ================= -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ================= FIREBASE CONFIG ================= */

        const firebaseConfig = {
            apiKey: "AIzaSyAB4wO937Rwc0OTWeJlGgoaxERWOdjaJM",
            authDomain: "my-new-a6e9f.firebaseapp.com",
            databaseURL: "https://my-new-a6e9f-default-rtdb.firebaseio.com",
            projectId: "my-new-a6e9f",
            storageBucket: "my-new-a6e9f.firebasestorage.app",
            messagingSenderId: "1034729064842",
            appId: "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const clientsRef = ref(db, "clients");

        let clients = {};

        /* ================= LOAD CLIENTS ================= */

        onValue(clientsRef, (snapshot) => {
            clients = snapshot.val() || {};
            displayStatusSummary();
            displayClients();
            checkNameAvailability();
            checkLinkAvailability();
        });

        /* ================= NORMALIZE ================= */

        function normalize(value) {
            return String(value || "").trim().toLowerCase();
        }

        /* ================= TOGGLE STATUS ================= */

        window.toggleStatus = function (boxId) {
            const box = document.getElementById(boxId);
            if (box) {
                box.classList.toggle("open");
            }
        };

        /* ================= DISPLAY STATUS SUMMARY ================= */

        function displayStatusSummary() {
            const lists = {
                waiting: document.getElementById("waitingList"),
                done: document.getElementById("doneList"),
                reject: document.getElementById("rejectList")
            };

            const counts = {
                waiting: document.getElementById("waitingCount"),
                done: document.getElementById("doneCount"),
                reject: document.getElementById("rejectCount")
            };

            const statusGroups = {
                waiting: [],
                done: [],
                reject: []
            };

            Object.keys(clients).forEach(id => {
                const client = clients[id];
                client.id = id;
                const status = client.status || "waiting";
                if (statusGroups[status]) {
                    statusGroups[status].push(client);
                }
            });

            ["waiting", "done", "reject"].forEach(status => {
                const group = statusGroups[status];
                counts[status].textContent = group.length;

                if (group.length === 0) {
                    lists[status].innerHTML = `<div class="no-status-users">لا يوجد عملاء</div>`;
                } else {
                    lists[status].innerHTML = group.map(client => `
                        <div class="status-user">
                            <div class="status-user-info">
                                <div class="status-user-name">${client.name || 'بدون اسم'}</div>
                                ${client.link ? `<a class="status-user-link" href="${client.link}" target="_blank">${client.link} 🔗</a>` : ''}
                                ${status === 'done' ? `
                                    <div class="status-user-notes">📝 ${client.notes ? client.notes : 'لا توجد ملاحظات'}</div>
                                ` : ''}
                            </div>
                            <div class="quick-actions">
                                ${status === 'waiting' ? `
                                    <button class="btn-quick-done" onclick="changeStatus('${client.id}', 'done')">✅ Done</button>
                                    <button class="btn-quick-reject" onclick="changeStatus('${client.id}', 'reject')">❌ Reject</button>
                                ` : ''}
                                ${status === 'done' ? `
                                    <button class="btn-quick-notes" onclick="editDoneNotes('${client.id}')">📝 ملاحظات</button>
                                ` : ''}
                            </div>
                        </div>
                    `).join("");
                }
            });
        }

        /* ================= QUICK STATUS CHANGE ================= */

        window.changeStatus = function (id, newStatus) {
            update(ref(db, `clients/${id}`), { status: newStatus });
        };

        /* ================= EDIT NOTES FOR DONE CLIENTS ================= */

        window.editDoneNotes = function (id) {
            const currentNotes = clients[id]?.notes || '';
            const newNotes = prompt("أدخل الملاحظات لهذا العميل:", currentNotes);
            if (newNotes !== null) {
                update(ref(db, `clients/${id}`), { notes: newNotes.trim() });
            }
        };

        /* ================= DISPLAY CLIENTS ================= */

        window.displayClients = function () {
            const container = document.getElementById("clientsContainer");
            const searchVal = normalize(document.getElementById("clientSearch").value);

            const keys = Object.keys(clients);

            if (keys.length === 0) {
                container.innerHTML = `<div class="empty">لا يوجد عملاء مضافين.</div>`;
                return;
            }

            const filteredKeys = keys.filter(id => {
                const c = clients[id];
                const name = normalize(c.name);
                const link = normalize(c.link);
                return name.includes(searchVal) || link.includes(searchVal);
            });

            if (filteredKeys.length === 0) {
                container.innerHTML = `<div class="empty">لا توجد نتائج مطابقة.</div>`;
                return;
            }

            container.innerHTML = filteredKeys.map(id => {
                const c = clients[id];
                const statusClass = c.status === "done" ? "status-done" : (c.status === "reject" ? "status-reject" : "status-waiting");
                const statusText = c.status === "done" ? "✅ done" : (c.status === "reject" ? "❌ recject" : "⏳ على الانتظار");

                return `
                    <div class="client-card" id="card-${id}">
                        <div class="client-name">${c.name || 'بدون اسم'}</div>
                        ${c.link ? `<a class="client-link" href="${c.link}" target="_blank">${c.link}</a>` : ''}
                        <div class="client-status ${statusClass}">${statusText}</div>
                        ${c.notes ? `<div class="client-notes"><strong>ملاحظات:</strong> ${c.notes}</div>` : `<div class="client-notes" style="color:#aaa;">لا توجد ملاحظات</div>`}
                        
                        <div class="actions">
                            <button class="edit-btn" onclick="editClient('${id}')">تعديل</button>
                            <button class="delete-btn" onclick="deleteClient('${id}')">حذف</button>
                        </div>
                    </div>
                `;
            }).join("");
        };

        /* ================= CHECK NAME & LINK ================= */

        window.checkNameAvailability = function () {
            const name = document.getElementById("clientName").value.trim();
            const result = document.getElementById("nameCheck");

            if (!name) {
                result.style.display = "none";
                checkAddButton();
                return;
            }

            const exists = Object.values(clients).some(c => normalize(c.name) === normalize(name));

            if (exists) {
                result.className = "check-result check-exists";
                result.textContent = "❌ هذا الاسم مستخدم من قبل";
            } else {
                result.className = "check-result check-available";
                result.textContent = "✅ الاسم متاح";
            }
            checkAddButton();
        };

        window.checkLinkAvailability = function () {
            const link = document.getElementById("clientLink").value.trim();
            const result = document.getElementById("linkCheck");

            if (!link) {
                result.style.display = "none";
                checkAddButton();
                return;
            }

            const exists = Object.values(clients).some(c => normalize(c.link) === normalize(link));

            if (exists) {
                result.className = "check-result check-exists";
                result.textContent = "❌ هذا اللينك مستخدم من قبل";
            } else {
                result.className = "check-result check-available";
                result.textContent = "✅ اللينك متاح";
            }
            checkAddButton();
        };

        function checkAddButton() {
            const name = document.getElementById("clientName").value.trim();
            const addBtn = document.getElementById("addBtn");
            addBtn.disabled = !name;
        }

        /* ================= ADD CLIENT ================= */

        window.addClient = function () {
            const name = document.getElementById("clientName").value.trim();
            const link = document.getElementById("clientLink").value.trim();
            const status = document.getElementById("clientStatus").value;
            const notes = document.getElementById("clientNotes").value.trim();

            if (!name) return;

            const newClientRef = push(clientsRef);
            set(newClientRef, {
                name,
                link,
                status,
                notes,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById("clientName").value = "";
                document.getElementById("clientLink").value = "";
                document.getElementById("clientNotes").value = "";
                document.getElementById("clientStatus").value = "waiting";
                checkNameAvailability();
                checkLinkAvailability();
            });
        };

        /* ================= EDIT & DELETE ================= */

        window.editClient = function (id) {
            const c = clients[id];
            const card = document.getElementById(`card-${id}`);

            card.innerHTML = `
                <div class="edit-content">
                    <input type="text" id="edit-name-${id}" value="${c.name || ''}" placeholder="اسم العميل">
                    <input type="text" id="edit-link-${id}" value="${c.link || ''}" placeholder="اللينك">
                    <select id="edit-status-${id}" class="status-select">
                        <option value="waiting" ${c.status === 'waiting' ? 'selected' : ''}>⏳ على الانتظار</option>
                        <option value="done" ${c.status === 'done' ? 'selected' : ''}>✅ done</option>
                        <option value="reject" ${c.status === 'reject' ? 'selected' : ''}>❌ recject</option>
                    </select>
                    <textarea id="edit-notes-${id}" placeholder="ملاحظات">${c.notes || ''}</textarea>
                    <div class="edit-actions">
                        <button class="save-btn" onclick="saveClient('${id}')">حفظ</button>
                        <button class="cancel-btn" onclick="displayClients()">إلغاء</button>
                    </div>
                </div>
            `;
        };

        window.saveClient = function (id) {
            const name = document.getElementById(`edit-name-${id}`).value.trim();
            const link = document.getElementById(`edit-link-${id}`).value.trim();
            const status = document.getElementById(`edit-status-${id}`).value;
            const notes = document.getElementById(`edit-notes-${id}`).value.trim();

            update(ref(db, `clients/${id}`), {
                name,
                link,
                status,
                notes
            });
        };

        window.deleteClient = function (id) {
            if (confirm("هل انت متاكد من حذف هذا العميل؟")) {
                remove(ref(db, `clients/${id}`));
            }
        };

    </script>
</body>

</html>
