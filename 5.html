<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العملاء</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #222;
        }

        /* ================= NAV ================= */

        .top-nav {
            background: #ffffff;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(60, 120, 180, 0.08);
        }

        .top-nav a {
            color: #2878c8;
            text-decoration: none;
            background: #eef7ff;
            border: 1px solid #cfe7fb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .top-nav a:hover {
            background: #dcefff;
            color: #1764a8;
            border-color: #b9dbf5;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* ================= SEARCH & ACTION BAR ================= */

        .action-bar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: #4d9bd6;
        }

        .toggle-add-btn {
            background: #2878c8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .toggle-add-btn:hover {
            background: #1764a8;
        }

        /* ================= FORM (Hidden by Default) ================= */

        .form-box {
            display: none;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
            border: 2px solid #2878c8;
        }

        .form-box.open {
            display: block;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2878c8;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6daee5;
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #198754;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #157347;
        }

        /* ================= STATUS SUMMARY ================= */

        .status-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .status-summary-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status-box {
            border: 1px solid #e1e8ef;
            border-radius: 7px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .status-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            user-select: none;
        }

        .status-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-arrow {
            font-size: 12px;
            transition: 0.2s;
        }

        .status-box.open .status-arrow {
            transform: rotate(90deg);
        }

        .waiting-header {
            background: #fff8df;
            color: #856404;
        }

        .no-tasks-header {
            background: #e2e8f0;
            color: #334155;
        }

        .done-header {
            background: #e5f5ed;
            color: #176b48;
        }

        .reject-header {
            background: #fdebec;
            color: #842029;
        }

        .status-count {
            background: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            min-width: 25px;
            text-align: center;
        }

        .status-list {
            display: none;
            padding: 8px;
            background: #fff;
        }

        .status-box.open .status-list {
            display: block;
        }

        .client-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2878c8;
        }

        .status-user {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .status-user.is-checked {
            background-color: #f0f7ff;
        }

        .status-user-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-user-info-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 180px;
        }

        .status-user-info {
            flex: 1;
        }

        .status-user-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .status-user-link {
            color: #2878c8;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
            display: block;
        }

        .status-user-notes {
            margin-top: 5px;
            font-size: 12px;
            color: #495057;
            background: #f1f8f5;
            padding: 5px 8px;
            border-radius: 4px;
            border-right: 3px solid #198754;
            white-space: pre-wrap;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-quick-done {
            background: #198754;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-no-tasks {
            background: #64748b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-reject {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-note {
            background: #0dcaf0;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-delete {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-delete:hover {
            background: #b02a37;
        }

        .no-status-users {
            color: #888;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }

        /* تعديل الملاحظات المدمج */
        .notes-edit-box {
            display: none;
            margin-top: 8px;
            gap: 6px;
        }

        .notes-edit-box.open {
            display: flex;
        }

        .notes-edit-box input {
            flex: 1;
            padding: 5px 8px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .notes-edit-box button {
            padding: 5px 10px;
            font-size: 11px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- ================= NAV ================= -->
    <div class="top-nav">
        <a href="https://elqwer14-spec.github.io/1/1.html">Data_Entry_links_Users</a>
        <a href="https://elqwer14-spec.github.io/1/2.html">Data_Users</a>
        <a href="https://elqwer14-spec.github.io/1/3.html">Last_add</a>
        <a href="https://elqwer14-spec.github.io/1/4.html">Wallet</a>
        <a href="https://elqwer14-spec.github.io/1/5.html">Clients</a>
        <a href="https://elqwer14-spec.github.io/1/6.html">not_done_for_User</a>
        <a href="https://elqwer14-spec.github.io/1/7.html">last_login</a>
        <a href="https://elqwer14-spec.github.io/1/8.html">sereach</a>
        <a href="https://elqwer14-spec.github.io/1/9.html">User/ref</a>
        <a href="https://elqwer14-spec.github.io/1/10.html">code/rdp</a>
        <a href="https://elqwer14-spec.github.io/1/11.html">Chat</a>
        <a href="https://elqwer14-spec.github.io/1/12.html">sheet</a>
    </div>

    <div class="container">

        <!-- ================= SEARCH & ACTION BAR ================= -->
        <div class="action-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث عن عميل بالاسم أو اللينك أو الملاحظات...">
            <button class="toggle-add-btn" id="toggleAddBtn">➕ إضافة عميل جديد</button>
        </div>

        <!-- ================= ADD CLIENT (Form Box) ================= -->
        <div class="form-box" id="formBox">
            <div class="form-title">إضافة عميل جديد</div>

            <div class="form-group">
                <label>اسم العميل *</label>
                <input type="text" id="clientName" placeholder="اكتب اسم العميل" autocomplete="off">
            </div>

            <div class="form-group">
                <label>لينك العميل</label>
                <input type="text" id="clientLink" placeholder="https://example.com" autocomplete="off">
            </div>

            <div class="form-group">
                <label>الحالة</label>
                <select id="clientStatus">
                    <option value="waiting">⏳ على الانتظار</option>
                    <option value="no_tasks">🚫 بدون تاسكات</option>
                    <option value="done">✅ done</option>
                    <option value="reject">❌ reject</option>
                </select>
            </div>

            <div class="form-group">
                <label>ملاحظات</label>
                <textarea id="clientNotes" placeholder="اكتب ملاحظات..."></textarea>
            </div>

            <button class="add-btn" id="addBtn">إضافة العميل</button>
        </div>

        <!-- ================= STATUS SUMMARY ================= -->
        <div class="status-summary">
            <div class="status-summary-title">حالات العملاء</div>

            <!-- قائمة الانتظار -->
            <div class="status-box" id="waitingBox">
                <div class="status-header waiting-header" onclick="toggleStatus('waitingBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>⏳ على الانتظار</span>
                    </div>
                    <span class="status-count" id="waitingCount">0</span>
                </div>
                <div class="status-list" id="waitingList">
                    <div id="waitingItems"></div>
                </div>
            </div>

            <!-- قائمة بدون تاسكات -->
            <div class="status-box" id="noTasksBox">
                <div class="status-header no-tasks-header" onclick="toggleStatus('noTasksBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>🚫 بدون تاسكات</span>
                    </div>
                    <span class="status-count" id="noTasksCount">0</span>
                </div>
                <div class="status-list" id="noTasksList"></div>
            </div>

            <!-- قائمة تم -->
            <div class="status-box" id="doneBox">
                <div class="status-header done-header" onclick="toggleStatus('doneBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>✅ done</span>
                    </div>
                    <span class="status-count" id="doneCount">0</span>
                </div>
                <div class="status-list" id="doneList"></div>
            </div>

            <!-- قائمة مرفوض -->
            <div class="status-box" id="rejectBox">
                <div class="status-header reject-header" onclick="toggleStatus('rejectBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>❌ reject</span>
                    </div>
                    <span class="status-count" id="rejectCount">0</span>
                </div>
                <div class="status-list" id="rejectList"></div>
            </div>

        </div>
    </div>

    <!-- ================= FIREBASE & APP SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAB4wO937rCwc0OTWeJlGgoaxERWOdjaJM",
            authDomain: "my-new-a6e9f.firebaseapp.com",
            databaseURL: "https://my-new-a6e9f-default-rtdb.firebaseio.com",
            projectId: "my-new-a6e9f",
            storageBucket: "my-new-a6e9f.firebasestorage.app",
            messagingSenderId: "1034729064842",
            appId: "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const clientsRef = ref(db, 'clients');

        let rawClientsData = null;

        // إظهار / إخفاء فورم إضافة العميل
        const toggleAddBtn = document.getElementById('toggleAddBtn');
        const formBox = document.getElementById('formBox');

        toggleAddBtn.addEventListener('click', () => {
            formBox.classList.toggle('open');
            if (formBox.classList.contains('open')) {
                toggleAddBtn.textContent = '❌ إغلاق نموذج الإضافة';
            } else {
                toggleAddBtn.textContent = '➕ إضافة عميل جديد';
            }
        });

        // إضافة عميل جديد
        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('clientName').value.trim();
            const link = document.getElementById('clientLink').value.trim();
            const status = document.getElementById('clientStatus').value;
            const notes = document.getElementById('clientNotes').value.trim();

            if (!name) {
                alert('يرجى إدخال اسم العميل');
                return;
            }

            push(clientsRef, {
                name,
                link,
                status,
                notes,
                checked: false,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('clientName').value = '';
                document.getElementById('clientLink').value = '';
                document.getElementById('clientNotes').value = '';
                formBox.classList.remove('open');
                toggleAddBtn.textContent = '➕ إضافة عميل جديد';
            });
        });

        // البحث التلقائي
        document.getElementById('searchInput').addEventListener('input', () => {
            renderClients(rawClientsData);
        });

        // مراقبة البيانات من Firebase
        onValue(clientsRef, (snapshot) => {
            rawClientsData = snapshot.val();
            renderClients(rawClientsData);
        });

        // دالة العرض والبحث
        function renderClients(data) {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();

            const containers = {
                waiting: document.getElementById('waitingItems'),
                no_tasks: document.getElementById('noTasksList'),
                done: document.getElementById('doneList'),
                reject: document.getElementById('rejectList')
            };

            const counts = { waiting: 0, no_tasks: 0, done: 0, reject: 0 };
            Object.keys(containers).forEach(key => containers[key].innerHTML = '');

            if (data) {
                const waitingClients = [];

                Object.keys(data).forEach(id => {
                    const client = data[id];
                    client.id = id;
                    const status = client.status || 'waiting';

                    // التصفية بالبحث
                    const nameMatch = (client.name || '').toLowerCase().includes(searchQuery);
                    const linkMatch = (client.link || '').toLowerCase().includes(searchQuery);
                    const notesMatch = (client.notes || '').toLowerCase().includes(searchQuery);

                    if (searchQuery && !nameMatch && !linkMatch && !notesMatch) {
                        return; // يتخطى العنصر إن لم يطابق البحث
                    }

                    if (counts[status] !== undefined) {
                        counts[status]++;

                        if (status === 'waiting') {
                            waitingClients.push(client);
                        } else {
                            // القوائم الأخرى غير الانتظار
                            containers[status].innerHTML += createClientHTML(client, false);
                        }
                    }
                });

                // ترتيب عملاء الانتظار: المحدد يظهر في الأعلى
                waitingClients.sort((a, b) => (b.checked === true ? 1 : 0) - (a.checked === true ? 1 : 0));

                // عرض قائمة الانتظار
                waitingClients.forEach(client => {
                    containers.waiting.innerHTML += createClientHTML(client, true);
                });
            }

            // تحديث العدادات
            document.getElementById('waitingCount').innerText = counts.waiting;
            document.getElementById('noTasksCount').innerText = counts.no_tasks;
            document.getElementById('doneCount').innerText = counts.done;
            document.getElementById('rejectCount').innerText = counts.reject;

            // رسائل للقوائم الفارغة
            Object.keys(containers).forEach(key => {
                if (containers[key].children.length === 0) {
                    containers[key].innerHTML = '<div class="no-status-users">لا يوجد عملاء</div>';
                }
            });

            // ربط أحداث الأزرار والـ Checkbox
            attachEvents();
        }

        // دالة إنشاء كود الـ HTML لكل عميل
        function createClientHTML(client, isWaitingList) {
            const isChecked = client.checked ? 'checked' : '';
            const checkedClass = client.checked ? 'is-checked' : '';

            return `
                <div class="status-user ${isWaitingList ? checkedClass : ''}">
                    <div class="status-user-top">
                        <div class="status-user-info-wrapper">
                            ${isWaitingList ? `<input type="checkbox" class="client-checkbox waiting-checkbox" data-id="${client.id}" ${isChecked}>` : ''}
                            <div class="status-user-info">
                                <div class="status-user-name">${escapeHTML(client.name)}</div>
                                ${client.link ? `<a href="${escapeAttribute(client.link)}" target="_blank" class="status-user-link auto-check-link" data-id="${client.id}">${escapeHTML(client.link)}</a>` : ''}
                            </div>
                        </div>
                        <div class="quick-actions">
                            ${client.status !== 'waiting' ? `<button class="btn-quick-no-tasks" data-id="${client.id}" data-status="waiting">⏳ انتظار</button>` : ''}
                            ${client.status !== 'done' ? `<button class="btn-quick-done" data-id="${client.id}" data-status="done">✅ done</button>` : ''}
                            ${client.status !== 'no_tasks' ? `<button class="btn-quick-no-tasks" data-id="${client.id}" data-status="no_tasks">🚫 بدون تاسكات</button>` : ''}
                            ${client.status !== 'reject' ? `<button class="btn-quick-reject" data-id="${client.id}" data-status="reject">❌ reject</button>` : ''}
                            <button class="btn-quick-note" data-id="${client.id}">📝 ملاحظات</button>
                            <button class="btn-quick-delete" data-id="${client.id}">🗑️ حذف</button>
                        </div>
                    </div>
                    ${client.notes ? `<div class="status-user-notes" id="note-display-${client.id}">${escapeHTML(client.notes)}</div>` : ''}
                    <div class="notes-edit-box" id="note-box-${client.id}">
                        <input type="text" id="note-input-${client.id}" value="${escapeAttribute(client.notes || '')}" placeholder="اكتب ملاحظات جديدة...">
                        <button class="btn-save-note" data-id="${client.id}">حفظ</button>
                    </div>
                </div>
            `;
        }

        // ربط الأحداث التفاعلية
        function attachEvents() {
            // تحويل حالة العميل
            document.querySelectorAll('.quick-actions button[data-status]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const newStatus = e.target.getAttribute('data-status');
                    update(ref(db, `clients/${id}`), { status: newStatus });
                });
            });

            // حذف العميل
            document.querySelectorAll('.btn-quick-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (confirm("هل أنت تأكد من حذف هذا العميل نهائياً؟")) {
                        remove(ref(db, `clients/${id}`));
                    }
                });
            });

            // إظهار/إخفاء مربع الملاحظات
            document.querySelectorAll('.btn-quick-note').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const noteBox = document.getElementById(`note-box-${id}`);
                    noteBox.classList.toggle('open');
                });
            });

            // حفظ الملاحظات الجديدة
            document.querySelectorAll('.btn-save-note').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const newNote = document.getElementById(`note-input-${id}`).value.trim();
                    update(ref(db, `clients/${id}`), { notes: newNote });
                });
            });

            // ربط ה- Checkbox يدوي
            document.querySelectorAll('.waiting-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const isChecked = e.target.checked;
                    update(ref(db, `clients/${id}`), { checked: isChecked });
                });
            });

            // تحديد العميل عند الضغط على اللينك
            document.querySelectorAll('.auto-check-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    update(ref(db, `clients/${id}`), { checked: true });
                });
            });
        }

        function escapeHTML(text) {
            if (!text) return '';
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttribute(text) {
            if (!text) return '';
            return String(text).replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>

    <script>
        function toggleStatus(boxId) {
            const box = document.getElementById(boxId);
            box.classList.toggle('open');
        }
    </script>
</body>

</html>
