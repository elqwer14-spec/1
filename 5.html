<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العملاء</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #222;
        }

        /* ================= NAV ================= */

        .top-nav {
            background: #ffffff;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(60, 120, 180, 0.08);
        }

        .top-nav a {
            color: #2878c8;
            text-decoration: none;
            background: #eef7ff;
            border: 1px solid #cfe7fb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .top-nav a:hover {
            background: #dcefff;
            color: #1764a8;
            border-color: #b9dbf5;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* ================= FORM ================= */

        .form-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6daee5;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #4d9bd6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #378ac8;
        }

        /* ================= STATUS SUMMARY ================= */

        .status-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .status-summary-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status-box {
            border: 1px solid #e1e8ef;
            border-radius: 7px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .status-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .status-header:hover {
            opacity: 0.9;
        }

        .status-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-arrow {
            font-size: 12px;
            transition: 0.2s;
        }

        .status-box.open .status-arrow {
            transform: rotate(90deg);
        }

        .waiting-header {
            background: #fff8df;
            color: #856404;
        }

        .done-header {
            background: #e5f5ed;
            color: #176b48;
        }

        .reject-header {
            background: #fdebec;
            color: #842029;
        }

        .status-count {
            background: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            min-width: 25px;
            text-align: center;
        }

        .status-list {
            display: none;
            padding: 8px;
            background: #fff;
        }

        .status-box.open .status-list {
            display: block;
        }

        .status-user {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .status-user:last-child {
            border-bottom: none;
        }

        .no-status-users {
            color: #888;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }

        /* ================= CLIENTS ================= */

        .clients-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .clients-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* ================= SEARCH ================= */

        .client-search {
            background: #f5f9fd;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .client-search input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .client-search input:focus {
            outline: none;
            border-color: #6daee5;
        }

        /* ================= CARD ================= */

        .client-card {
            border: 1px solid #dce5ed;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fff;
        }

        .client-content {
            width: 100%;
        }

        .client-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .client-link {
            display: block;
            color: #2878c8;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .client-link:hover {
            text-decoration: underline;
        }

        .client-notes {
            font-size: 13px;
            color: #555;
            margin-top: 7px;
            white-space: pre-wrap;
        }

        /* ================= STATUS ================= */

        .client-status {
            display: inline-block;
            margin: 5px 0 8px 0;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-done {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-reject {
            background: #f8d7da;
            color: #842029;
        }

        .status-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 7px;
        }

        /* ================= ACTIONS ================= */

        .actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .actions button {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        .edit-btn {
            background: #4d9bd6;
        }

        .edit-btn:hover {
            background: #378ac8;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .save-btn {
            background: #198754;
        }

        .save-btn:hover {
            background: #157347;
        }

        .cancel-btn {
            background: #6c757d;
        }

        .cancel-btn:hover {
            background: #5c636a;
        }

        /* ================= EDIT ================= */

        .edit-content input,
        .edit-content textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .edit-content textarea {
            min-height: 70px;
            resize: vertical;
        }

        .edit-content input:focus,
        .edit-content textarea:focus {
            outline: none;
            border-color: #6daee5;
        }

        .edit-actions {
            display: flex;
            gap: 7px;
        }

        .edit-actions button {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        /* ================= EMPTY ================= */

        .loading,
        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .top-nav {
                padding: 8px;
            }

            .top-nav a {
                font-size: 11px;
                padding: 7px 8px;
            }

            .container {
                margin-top: 12px;
            }
        }
    </style>
</head>

    <!-- ================= NAV ================= -->

    <div class="top-nav">

    <div class="container">

        <!-- ================= ADD CLIENT ================= -->

        <div class="form-box">

            <div class="form-title">
                إضافة عميل
            </div>

            <div class="form-group">

                <label>
                    اسم العميل
                </label>

                <input
                    type="text"
                    id="clientName"
                    placeholder="اكتب اسم العميل"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label>
                    لينك العميل
                </label>

                <input
                    type="text"
                    id="clientLink"
                    placeholder="https://example.com"
                    autocomplete="off">

            </div>


            <div class="form-group">

                <label>
                    الحالة
                </label>

                <select id="clientStatus">

                    <option value="waiting">
                        ⏳ على الانتظار
                    </option>

                    <option value="done">
                        ✅ done
                    </option>

                    <option value="reject">
                        ❌ recject
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    ملاحظات
                </label>

                <textarea
                    id="clientNotes"
                    placeholder="اكتب ملاحظات..."></textarea>

            </div>


            <button
                class="add-btn"
                onclick="addClient()">

                إضافة العميل

            </button>

        </div>


        <!-- ================= STATUS SUMMARY ================= -->

        <div class="status-summary">

            <div class="status-summary-title">
                حالات العملاء
            </div>


            <!-- WAITING -->

            <div
                class="status-box"
                id="waitingBox">

                <div
                    class="status-header waiting-header"
                    onclick="toggleStatus('waitingBox')">

                    <div class="status-header-left">

                        <span class="status-arrow">
                            ▶
                        </span>

                        <span>
                            ⏳ على الانتظار
                        </span>

                    </div>

                    <span
                        class="status-count"
                        id="waitingCount">
                        0
                    </span>

                </div>


                <div
                    class="status-list"
                    id="waitingList">

                </div>

            </div>


            <!-- DONE -->

            <div
                class="status-box"
                id="doneBox">

                <div
                    class="status-header done-header"
                    onclick="toggleStatus('doneBox')">

                    <div class="status-header-left">

                        <span class="status-arrow">
                            ▶
                        </span>

                        <span>
                            ✅ done
                        </span>

                    </div>

                    <span
                        class="status-count"
                        id="doneCount">
                        0
                    </span>

                </div>


                <div
                    class="status-list"
                    id="doneList">

                </div>

            </div>


            <!-- REJECT -->

            <div
                class="status-box"
                id="rejectBox">

                <div
                    class="status-header reject-header"
                    onclick="toggleStatus('rejectBox')">

                    <div class="status-header-left">

                        <span class="status-arrow">
                            ▶
                        </span>

                        <span>
                            ❌ recject
                        </span>

                    </div>

                    <span
                        class="status-count"
                        id="rejectCount">
                        0
                    </span>

                </div>


                <div
                    class="status-list"
                    id="rejectList">

                </div>

            </div>

        </div>


        <!-- ================= CLIENTS ================= -->

        <div class="clients-box">

            <div class="clients-title">
                قائمة العملاء
            </div>


            <!-- SEARCH -->

            <div class="client-search">

                <input
                    type="text"
                    id="clientSearch"
                    placeholder="🔎 ابحث عن عميل..."
                    autocomplete="off">

            </div>


            <div id="clientsContainer">

                <div class="loading">
                    جاري تحميل العملاء...
                </div>

            </div>

        </div>

    </div>


    <!-- ================= FIREBASE ================= -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            push,
            set,
            onValue,
            update,
            remove
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


        /* ================= FIREBASE CONFIG ================= */

        const firebaseConfig = {

            apiKey: "AIzaSyAB4wO937Rwc0OTWeJlGgoaxERWOdjaJM",

            authDomain: "my-new-a6e9f.firebaseapp.com",

            databaseURL:
                "https://my-new-a6e9f-default-rtdb.firebaseio.com",

            projectId: "my-new-a6e9f",

            storageBucket:
                "my-new-a6e9f.firebasestorage.app",

            messagingSenderId:
                "1034729064842",

            appId:
                "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"

        };


        const app =
            initializeApp(firebaseConfig);

        const db =
            getDatabase(app);

        const clientsRef =
            ref(db, "clients");


        let clients = {};


        /* ================= LOAD CLIENTS ================= */

        onValue(clientsRef, (snapshot) => {

            clients =
                snapshot.val() || {};

            displayStatusSummary();

            displayClients();

        });


        /* ================= STATUS SUMMARY ================= */

        window.displayStatusSummary = function () {

            const waiting = [];
            const done = [];
            const reject = [];


            Object.entries(clients).forEach(
                ([id, client]) => {

                    const status =
                        client.status || "waiting";


                    if (status === "waiting") {

                        waiting.push(client);

                    }

                    else if (status === "done") {

                        done.push(client);

                    }

                    else if (
                        status === "reject" ||
                        status === "recject"
                    ) {

                        reject.push(client);

                    }

                }
            );


            /* العدد */

            document.getElementById(
                "waitingCount"
            ).textContent = waiting.length;


            document.getElementById(
                "doneCount"
            ).textContent = done.length;


            document.getElementById(
                "rejectCount"
            ).textContent = reject.length;


            /* القوائم */

            createStatusList(
                "waitingList",
                waiting,
                "لا يوجد عملاء على الانتظار"
            );


            createStatusList(
                "doneList",
                done,
                "لا يوجد عملاء done"
            );


            createStatusList(
                "rejectList",
                reject,
                "لا يوجد عملاء مرفوضين"
            );

        };


        /* ================= CREATE STATUS LIST ================= */

        function createStatusList(
            elementId,
            users,
            emptyText
        ) {

            const element =
                document.getElementById(elementId);


            element.innerHTML = "";


            if (users.length === 0) {

                element.innerHTML = `
                    <div class="no-status-users">
                        ${emptyText}
                    </div>
                `;

                return;

            }


            users.forEach(client => {

                const div =
                    document.createElement("div");


                div.className =
                    "status-user";


                div.textContent =
                    client.name || "بدون اسم";


                element.appendChild(div);

            });

        }


        /* ================= TOGGLE STATUS ================= */

        window.toggleStatus = function (id) {

            const box =
                document.getElementById(id);


            if (!box) return;


            box.classList.toggle("open");

        };


        /* ================= ADD CLIENT ================= */

        window.addClient = async function () {

            const name =
                document
                    .getElementById("clientName")
                    .value
                    .trim();


            const link =
                document
                    .getElementById("clientLink")
                    .value
                    .trim();


            const status =
                document
                    .getElementById("clientStatus")
                    .value;


            const notes =
                document
                    .getElementById("clientNotes")
                    .value
                    .trim();


            if (!name) {

                alert("اكتب اسم العميل");

                return;

            }


            if (!link) {

                alert("اكتب لينك العميل");

                return;

            }


            try {

                const newClientRef =
                    push(clientsRef);


                await set(
                    newClientRef,
                    {

                        name: name,

                        link: link,

                        status:
                            status || "waiting",

                        notes: notes,

                        createdAt:
                            Date.now()

                    }
                );


                /* تنظيف الفورم */

                document
                    .getElementById("clientName")
                    .value = "";


                document
                    .getElementById("clientLink")
                    .value = "";


                document
                    .getElementById("clientStatus")
                    .value = "waiting";


                document
                    .getElementById("clientNotes")
                    .value = "";


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء إضافة العميل"
                );

            }

        };


        /* ================= DISPLAY CLIENTS ================= */

        window.displayClients = function () {

            const container =
                document.getElementById(
                    "clientsContainer"
                );


            const searchInput =
                document.getElementById(
                    "clientSearch"
                );


            const search =
                searchInput
                    ? searchInput.value
                        .trim()
                        .toLowerCase()
                    : "";


            let entries =
                Object.entries(clients);


            /* الأحدث أولاً */

            entries.sort((a, b) => {

                return (
                    (b[1].createdAt || 0) -
                    (a[1].createdAt || 0)
                );

            });


            /* البحث */

            if (search) {

                entries =
                    entries.filter(
                        ([id, client]) => {

                            const name =
                                String(
                                    client.name || ""
                                ).toLowerCase();


                            const link =
                                String(
                                    client.link || ""
                                ).toLowerCase();


                            return (
                                name.includes(search) ||
                                link.includes(search)
                            );

                        }
                    );

            }


            if (entries.length === 0) {

                container.innerHTML = search
                    ? `
                        <div class="empty">
                            لا يوجد عميل مطابق للبحث
                        </div>
                    `
                    : `
                        <div class="empty">
                            لا يوجد عملاء حتى الآن
                        </div>
                    `;

                return;

            }


            container.innerHTML = "";


            entries.forEach(
                ([id, client]) => {


                    /* ================= STATUS ================= */

                    const clientStatus =
                        client.status || "waiting";


                    let statusText =
                        "⏳ على الانتظار";


                    let statusClass =
                        "status-waiting";


                    if (
                        clientStatus === "done"
                    ) {

                        statusText =
                            "✅ done";

                        statusClass =
                            "status-done";

                    }


                    if (
                        clientStatus === "reject" ||
                        clientStatus === "recject"
                    ) {

                        statusText =
                            "❌ recject";

                        statusClass =
                            "status-reject";

                    }


                    /* ================= CARD ================= */

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "client-card";


                    card.id =
                        `client_${id}`;


                    card.innerHTML = `

                        <div class="client-content">

                            <div class="client-name">
                                ${escapeHTML(
                                    client.name || ""
                                )}
                            </div>


                            <div class="client-status ${statusClass}">
                                ${statusText}
                            </div>


                            <a
                                class="client-link"
                                href="${escapeAttribute(
                                    client.link || ""
                                )}"
                                target="_blank"
                                rel="noopener noreferrer">

                                ${escapeHTML(
                                    client.link || ""
                                )}

                            </a>


                            ${
                                client.notes
                                ?
                                `
                                <div class="client-notes">
                                    ${escapeHTML(
                                        client.notes
                                    )}
                                </div>
                                `
                                :
                                ""
                            }


                            <div class="actions">

                                <button
                                    class="edit-btn"
                                    onclick="editClient('${id}')">

                                    تعديل

                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteClient('${id}')">

                                    حذف

                                </button>

                            </div>

                        </div>

                    `;


                    container.appendChild(card);

                }
            );

        };


        /* ================= EDIT CLIENT ================= */

        window.editClient = function (id) {

            const client =
                clients[id];


            if (!client) return;


            const card =
                document.getElementById(
                    `client_${id}`
                );


            if (!card) return;


            let status =
                client.status || "waiting";


            if (status === "recject") {

                status = "reject";

            }


            card.innerHTML = `

                <div class="edit-content">

                    <input
                        type="text"
                        id="editName_${id}"
                        value="${escapeAttribute(
                            client.name || ""
                        )}"
                        placeholder="اسم العميل">


                    <input
                        type="text"
                        id="editLink_${id}"
                        value="${escapeAttribute(
                            client.link || ""
                        )}"
                        placeholder="لينك العميل">


                    <select
                        id="editStatus_${id}"
                        class="status-select">

                        <option
                            value="waiting"
                            ${
                                status === "waiting"
                                    ? "selected"
                                    : ""
                            }>

                            ⏳ على الانتظار

                        </option>


                        <option
                            value="done"
                            ${
                                status === "done"
                                    ? "selected"
                                    : ""
                            }>

                            ✅ done

                        </option>


                        <option
                            value="reject"
                            ${
                                status === "reject"
                                    ? "selected"
                                    : ""
                            }>

                            ❌ recject

                        </option>

                    </select>


                    <textarea
                        id="editNotes_${id}"
                        placeholder="ملاحظات">${escapeHTML(
                            client.notes || ""
                        )}</textarea>


                    <div class="edit-actions">

                        <button
                            class="save-btn"
                            onclick="saveClientEdit('${id}')">

                            حفظ

                        </button>


                        <button
                            class="cancel-btn"
                            onclick="displayClients()">

                            إلغاء

                        </button>

                    </div>

                </div>

            `;

        };


        /* ================= SAVE EDIT ================= */

        window.saveClientEdit = async function (id) {

            const name =
                document
                    .getElementById(
                        `editName_${id}`
                    )
                    .value
                    .trim();


            const link =
                document
                    .getElementById(
                        `editLink_${id}`
                    )
                    .value
                    .trim();


            const status =
                document
                    .getElementById(
                        `editStatus_${id}`
                    )
                    .value;


            const notes =
                document
                    .getElementById(
                        `editNotes_${id}`
                    )
                    .value
                    .trim();


            if (!name) {

                alert("اكتب اسم العميل");

                return;

            }


            if (!link) {

                alert("اكتب لينك العميل");

                return;

            }


            try {

                const clientRef =
                    ref(
                        db,
                        `clients/${id}`
                    );


                await update(
                    clientRef,
                    {

                        name: name,

                        link: link,

                        status: status,

                        notes: notes

                    }
                );


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء حفظ التعديل"
                );

            }

        };


        /* ================= DELETE CLIENT ================= */

        window.deleteClient = async function (id) {

            const client =
                clients[id];


            if (!client) return;


            const confirmed =
                confirm(
                    `هل أنت متأكد من حذف العميل "${client.name || ""}"؟`
                );


            if (!confirmed) return;


            try {

                const clientRef =
                    ref(
                        db,
                        `clients/${id}`
                    );


                await remove(clientRef);


            } catch (error) {

                console.error(error);

                alert(
                    "حدث خطأ أثناء حذف العميل"
                );

            }

        };


        /* ================= SEARCH ================= */

        document
            .getElementById("clientSearch")
            .addEventListener(
                "input",
                function () {

                    displayClients();

                }
            );


        /* ================= ESCAPE HTML ================= */

        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ================= ESCAPE ATTRIBUTE ================= */

        function escapeAttribute(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                );

        }

    </script>

</body>

</html>
