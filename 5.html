<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العملاء</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #222;
        }

        /* ================= NAV ================= */

        .top-nav {
            background: #ffffff;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(60, 120, 180, 0.08);
        }

        .top-nav a {
            color: #2878c8;
            text-decoration: none;
            background: #eef7ff;
            border: 1px solid #cfe7fb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .top-nav a:hover {
            background: #dcefff;
            color: #1764a8;
            border-color: #b9dbf5;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* ================= FORM ================= */

        .form-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6daee5;
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        /* ================= CHECK NAME ================= */

        .check-result {
            margin-top: 5px;
            padding: 7px 9px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }

        .check-available {
            display: block;
            background: #e7f7ed;
            color: #157347;
            border: 1px solid #b9e4ca;
        }

        .check-exists {
            display: block;
            background: #fde8e8;
            color: #b42318;
            border: 1px solid #f2b8b5;
        }

        .check-searching {
            display: block;
            background: #eef7ff;
            color: #2878c8;
            border: 1px solid #cfe7fb;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #4d9bd6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #378ac8;
        }

        .add-btn:disabled {
            background: #b7c5d1;
            cursor: not-allowed;
        }

        /* ================= STATUS SUMMARY ================= */

        .status-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .status-summary-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status-box {
            border: 1px solid #e1e8ef;
            border-radius: 7px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .status-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .status-header:hover {
            opacity: 0.9;
        }

        .status-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-arrow {
            font-size: 12px;
            transition: 0.2s;
        }

        .status-box.open .status-arrow {
            transform: rotate(90deg);
        }

        .waiting-header {
            background: #fff8df;
            color: #856404;
        }

        .no-tasks-header {
            background: #e2e8f0;
            color: #334155;
        }

        .done-header {
            background: #e5f5ed;
            color: #176b48;
        }

        .reject-header {
            background: #fdebec;
            color: #842029;
        }

        .status-count {
            background: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            min-width: 25px;
            text-align: center;
        }

        .status-list {
            display: none;
            padding: 8px;
            background: #fff;
        }

        .status-box.open .status-list {
            display: block;
        }

        .status-user {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .status-user-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-user:last-child {
            border-bottom: none;
        }

        .status-user-info {
            flex: 1;
            min-width: 180px;
        }

        .status-user-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .status-user-link {
            color: #2878c8;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
            display: block;
        }

        .status-user-link:hover {
            text-decoration: underline;
        }

        .status-user-notes {
            margin-top: 5px;
            font-size: 12px;
            color: #495057;
            background: #f1f8f5;
            padding: 5px 8px;
            border-radius: 4px;
            border-right: 3px solid #198754;
            white-space: pre-wrap;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-quick-done {
            background: #198754;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-done:hover {
            background: #146c43;
        }

        .btn-quick-no-tasks {
            background: #64748b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-no-tasks:hover {
            background: #475569;
        }

        .btn-quick-reject {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-reject:hover {
            background: #b22a37;
        }

        .btn-quick-notes {
            background: #0dcaf0;
            color: #212529;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-notes:hover {
            background: #31d2f2;
        }

        .btn-toggle-sublinks {
            background: #e2e8f0;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 5px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-toggle-sublinks:hover {
            background: #cbd5e1;
        }

        /* Sublinks Drawer Styling */
        .sublinks-section {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }

        .sublinks-section.active {
            display: block;
        }

        .sublinks-title {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
            color: #475569;
        }

        .sublinks-list {
            list-style: none;
            padding: 0;
            margin: 0 0 8px 0;
        }

        .sublinks-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 5px 8px;
            border: 1px solid #edf2f7;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .sublinks-item a {
            color: #2563eb;
            text-decoration: none;
            word-break: break-all;
        }

        .sublinks-item a:hover {
            text-decoration: underline;
        }

        .btn-del-sublink {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            padding: 0 4px;
        }

        .add-sublink-form {
            display: flex;
            gap: 5px;
        }

        .add-sublink-form input {
            flex: 1;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 11px;
        }

        .add-sublink-form button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .add-sublink-form button:hover {
            background: #2563eb;
        }

        .no-status-users {
            color: #888;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }

        /* ================= CLIENTS ================= */

        .clients-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .clients-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* ================= SEARCH ================= */

        .client-search {
            background: #f5f9fd;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .client-search input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .client-search input:focus {
            outline: none;
            border-color: #6daee5;
        }

        /* ================= CLIENT CARD ================= */

        .client-card {
            border: 1px solid #dce5ed;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fff;
        }

        .client-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .client-link {
            display: block;
            color: #2878c8;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .client-link:hover {
            text-decoration: underline;
        }

        .client-notes {
            font-size: 13px;
            color: #555;
            margin-top: 7px;
            white-space: pre-wrap;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
            border-right: 3px solid #2878c8;
        }

        /* ================= STATUS ================= */

        .client-status {
            display: inline-block;
            margin: 5px 0 8px 0;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-no_tasks {
            background: #e2e8f0;
            color: #334155;
        }

        .status-done {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-reject {
            background: #f8d7da;
            color: #842029;
        }

        .status-select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 7px;
        }

        /* ================= ACTIONS ================= */

        .actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .actions button {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        .edit-btn {
            background: #4d9bd6;
        }

        .edit-btn:hover {
            background: #378ac8;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .save-btn {
            background: #198754;
        }

        .cancel-btn {
            background: #6c757d;
        }

        /* ================= EDIT ================= */

        .edit-content input,
        .edit-content textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .edit-content textarea {
            min-height: 70px;
            resize: vertical;
        }

        .edit-actions {
            display: flex;
            gap: 7px;
        }

        .edit-actions button {
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }

        /* ================= EMPTY ================= */

        .loading,
        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .top-nav {
                padding: 8px;
            }

            .top-nav a {
                font-size: 11px;
                padding: 7px 8px;
            }

            .container {
                margin-top: 12px;
            }
        }
    </style>

</head>

<body>

    <!-- ================= NAV ================= -->

    <div class="top-nav">
        <a href="https://elqwer14-spec.github.io/1/1.html">1. Data_Entry_links_Users</a>
        <a href="https://elqwer14-spec.github.io/1/2.html">2. Data_Users</a>
        <a href="https://elqwer14-spec.github.io/1/3.html">3. Last_add</a>
        <a href="https://elqwer14-spec.github.io/1/4.html">4. Wallet</a>
        <a href="https://elqwer14-spec.github.io/1/5.html">5. Clients</a>
        <a href="https://elqwer14-spec.github.io/1/6.html">6. not_done_for_User</a>
        <a href="https://elqwer14-spec.github.io/1/7.html">7. last_login</a>
        <a href="https://elqwer14-spec.github.io/1/8.html">8. Search</a>
    </div>

    <div class="container">

        <!-- ================= ADD CLIENT ================= -->

        <div class="form-box">
            <div class="form-title">إضافة عميل</div>

            <div class="form-group">
                <label>اسم العميل</label>
                <input type="text" id="clientName" placeholder="اكتب اسم العميل" autocomplete="off" oninput="checkNameAvailability()">
                <div id="nameCheck" class="check-result"></div>
            </div>

            <div class="form-group">
                <label>لينك العميل</label>
                <input type="text" id="clientLink" placeholder="https://example.com" autocomplete="off" oninput="checkLinkAvailability()">
                <div id="linkCheck" class="check-result"></div>
            </div>

            <div class="form-group">
                <label>الحالة</label>
                <select id="clientStatus">
                    <option value="waiting">⏳ على الانتظار</option>
                    <option value="no_tasks">🚫 بدون تاسكات</option>
                    <option value="done">✅ done</option>
                    <option value="reject">❌ recject</option>
                </select>
            </div>

            <div class="form-group">
                <label>ملاحظات</label>
                <textarea id="clientNotes" placeholder="اكتب ملاحظات..."></textarea>
            </div>

            <button class="add-btn" id="addBtn" onclick="addClient()">إضافة العميل</button>
        </div>

        <!-- ================= STATUS SUMMARY ================= -->

        <div class="status-summary">
            <div class="status-summary-title">حالات العملاء</div>

            <div class="status-box" id="waitingBox">
                <div class="status-header waiting-header" onclick="toggleStatus('waitingBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>⏳ على الانتظار</span>
                    </div>
                    <span class="status-count" id="waitingCount">0</span>
                </div>
                <div class="status-list" id="waitingList"></div>
            </div>

            <!-- قائمه بدون تاسكات الجديدة تحت قائمه الانتظار -->
            <div class="status-box" id="noTasksBox">
                <div class="status-header no-tasks-header" onclick="toggleStatus('noTasksBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>🚫 بدون تاسكات</span>
                    </div>
                    <span class="status-count" id="noTasksCount">0</span>
                </div>
                <div class="status-list" id="noTasksList"></div>
            </div>

            <div class="status-box" id="doneBox">
                <div class="status-header done-header" onclick="toggleStatus('doneBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>✅ done</span>
                    </div>
                    <span class="status-count" id="doneCount">0</span>
                </div>
                <div class="status-list" id="doneList"></div>
            </div>

            <div class="status-box" id="rejectBox">
                <div class="status-header reject-header" onclick="toggleStatus('rejectBox')">
