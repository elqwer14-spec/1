<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العملاء</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #222;
        }

        /* ================= NAV ================= */

        .top-nav {
            background: #ffffff;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(60, 120, 180, 0.08);
        }

        .top-nav a {
            color: #2878c8;
            text-decoration: none;
            background: #eef7ff;
            border: 1px solid #cfe7fb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .top-nav a:hover {
            background: #dcefff;
            color: #1764a8;
            border-color: #b9dbf5;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* ================= FORM ================= */

        .form-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6daee5;
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #4d9bd6;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn:hover {
            background: #378ac8;
        }

        /* ================= STATUS SUMMARY ================= */

        .status-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .status-summary-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .status-box {
            border: 1px solid #e1e8ef;
            border-radius: 7px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .status-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .status-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-arrow {
            font-size: 12px;
            transition: 0.2s;
        }

        .status-box.open .status-arrow {
            transform: rotate(90deg);
        }

        .waiting-header {
            background: #fff8df;
            color: #856404;
        }

        .no-tasks-header {
            background: #e2e8f0;
            color: #334155;
        }

        .done-header {
            background: #e5f5ed;
            color: #176b48;
        }

        .reject-header {
            background: #fdebec;
            color: #842029;
        }

        .status-count {
            background: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            min-width: 25px;
            text-align: center;
        }

        .status-list {
            display: none;
            padding: 8px;
            background: #fff;
        }

        .status-box.open .status-list {
            display: block;
        }

        .client-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2878c8;
        }

        .status-user {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        /* خلفية مُميّزة للعميل المُعلّم عليه */
        .status-user.is-checked {
            background-color: #f0f7ff;
        }

        .status-user-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-user-info-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 180px;
        }

        .status-user-info {
            flex: 1;
        }

        .status-user-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .status-user-link {
            color: #2878c8;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
            display: block;
        }

        .status-user-notes {
            margin-top: 5px;
            font-size: 12px;
            color: #495057;
            background: #f1f8f5;
            padding: 5px 8px;
            border-radius: 4px;
            border-right: 3px solid #198754;
            white-space: pre-wrap;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-quick-done {
            background: #198754;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-no-tasks {
            background: #64748b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-reject {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .no-status-users {
            color: #888;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <!-- ================= NAV ================= -->
    <div class="top-nav">
        <a href="https://elqwer14-spec.github.io/1/1.html">Data_Entry_links_Users</a>
        <a href="https://elqwer14-spec.github.io/1/2.html">Data_Users</a>
        <a href="https://elqwer14-spec.github.io/1/3.html">Last_add</a>
        <a href="https://elqwer14-spec.github.io/1/4.html">Wallet</a>
        <a href="https://elqwer14-spec.github.io/1/5.html">Clients</a>
        <a href="https://elqwer14-spec.github.io/1/6.html">not_done_for_User</a>
        <a href="https://elqwer14-spec.github.io/1/7.html">last_login</a>
        <a href="https://elqwer14-spec.github.io/1/8.html">sereach</a>
        <a href="https://elqwer14-spec.github.io/1/9.html">User/ref</a>
        <a href="https://elqwer14-spec.github.io/1/10.html">code/rdp</a>
        <a href="https://elqwer14-spec.github.io/1/11.html">Chat</a>
        <a href="https://elqwer14-spec.github.io/1/12.html">sheet</a>
    </div>

    <div class="container">

        <!-- ================= ADD CLIENT ================= -->
        <div class="form-box">
            <div class="form-title">إضافة عميل</div>

            <div class="form-group">
                <label>اسم العميل</label>
                <input type="text" id="clientName" placeholder="اكتب اسم العميل" autocomplete="off">
            </div>

            <div class="form-group">
                <label>لينك العميل</label>
                <input type="text" id="clientLink" placeholder="https://example.com" autocomplete="off">
            </div>

            <div class="form-group">
                <label>الحالة</label>
                <select id="clientStatus">
                    <option value="waiting">⏳ على الانتظار</option>
                    <option value="no_tasks">🚫 بدون تاسكات</option>
                    <option value="done">✅ done</option>
                    <option value="reject">❌ reject</option>
                </select>
            </div>

            <div class="form-group">
                <label>ملاحظات</label>
                <textarea id="clientNotes" placeholder="اكتب ملاحظات..."></textarea>
            </div>

            <button class="add-btn" id="addBtn">إضافة العميل</button>
        </div>

        <!-- ================= STATUS SUMMARY ================= -->
        <div class="status-summary">
            <div class="status-summary-title">حالات العملاء</div>

            <!-- قائمة الانتظار (مغلقة افتراضياً) -->
            <div class="status-box" id="waitingBox">
                <div class="status-header waiting-header" onclick="toggleStatus('waitingBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>⏳ على الانتظار</span>
                    </div>
                    <span class="status-count" id="waitingCount">0</span>
                </div>
                <div class="status-list" id="waitingList">
                    <div id="waitingItems"></div>
                </div>
            </div>

            <!-- قائمة بدون تاسكات -->
            <div class="status-box" id="noTasksBox">
                <div class="status-header no-tasks-header" onclick="toggleStatus('noTasksBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>🚫 بدون تاسكات</span>
                    </div>
                    <span class="status-count" id="noTasksCount">0</span>
                </div>
                <div class="status-list" id="noTasksList"></div>
            </div>

            <!-- قائمة تم -->
            <div class="status-box" id="doneBox">
                <div class="status-header done-header" onclick="toggleStatus('doneBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>✅ done</span>
                    </div>
                    <span class="status-count" id="doneCount">0</span>
                </div>
                <div class="status-list" id="doneList"></div>
            </div>

            <!-- قائمة مرفوض -->
            <div class="status-box" id="rejectBox">
                <div class="status-header reject-header" onclick="toggleStatus('rejectBox')">
                    <div class="status-header-left">
                        <span class="status-arrow">▶</span>
                        <span>❌ reject</span>
                    </div>
                    <span class="status-count" id="rejectCount">0</span>
                </div>
                <div class="status-list" id="rejectList"></div>
            </div>

        </div>
    </div>

    <!-- ================= FIREBASE & APP SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAB4wO937rCwc0OTWeJlGgoaxERWOdjaJM",
            authDomain: "my-new-a6e9f.firebaseapp.com",
            databaseURL: "https://my-new-a6e9f-default-rtdb.firebaseio.com",
            projectId: "my-new-a6e9f",
            storageBucket: "my-new-a6e9f.firebasestorage.app",
            messagingSenderId: "1034729064842",
            appId: "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const clientsRef = ref(db, 'clients');

        // إضافة عميل جديد
        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('clientName').value.trim();
            const link = document.getElementById('clientLink').value.trim();
            const status = document.getElementById('clientStatus').value;
            const notes = document.getElementById('clientNotes').value.trim();

            if (!name) {
                alert('يرجى إدخال اسم العميل');
                return;
            }

            push(clientsRef, {
                name,
                link,
                status,
                notes,
                checked: false,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('clientName').value = '';
                document.getElementById('clientLink').value = '';
                document.getElementById('clientNotes').value = '';
            });
        });

        // مراقبة البيانات من Firebase
        onValue(clientsRef, (snapshot) => {
            const data = snapshot.val();
            
            const containers = {
                waiting: document.getElementById('waitingItems'),
                no_tasks: document.getElementById('noTasksList'),
                done: document.getElementById('doneList'),
                reject: document.getElementById('rejectList')
            };

            const counts = { waiting: 0, no_tasks: 0, done: 0, reject: 0 };
            Object.keys(containers).forEach(key => containers[key].innerHTML = '');

            if (data) {
                const waitingClients = [];

                Object.keys(data).forEach(id => {
                    const client = data[id];
                    client.id = id;
                    const status = client.status || 'waiting';

                    if (counts[status] !== undefined) {
                        counts[status]++;

                        if (status === 'waiting') {
                            waitingClients.push(client);
                        } else {
                            // باقي القوائم
                            containers[status].innerHTML += `
                                <div class="status-user">
                                    <div class="status-user-top">
                                        <div class="status-user-info">
                                            <div class="status-user-name">${client.name}</div>
                                            ${client.link ? `<a href="${client.link}" target="_blank" class="status-user-link">${client.link}</a>` : ''}
                                        </div>
                                        <div class="quick-actions">
                                            <button class="btn-quick-no-tasks" data-id="${id}" data-status="waiting">⏳ انتظار</button>
                                            <button class="btn-quick-done" data-id="${id}" data-status="done">✅ done</button>
                                            <button class="btn-quick-no-tasks" data-id="${id}" data-status="no_tasks">🚫 بدون تاسكات</button>
                                            <button class="btn-quick-reject" data-id="${id}" data-status="reject">❌ reject</button>
                                        </div>
                                    </div>
                                    ${client.notes ? `<div class="status-user-notes">${client.notes}</div>` : ''}
                                </div>
                            `;
                        }
                    }
                });

                // ترتيب عملاء الانتظار: المحدد يظهر في الأعلى
                waitingClients.sort((a, b) => (b.checked === true ? 1 : 0) - (a.checked === true ? 1 : 0));

                // عرض عملاء قائمة الانتظار
                waitingClients.forEach(client => {
                    const isChecked = client.checked ? 'checked' : '';
                    const checkedClass = client.checked ? 'is-checked' : '';

                    containers.waiting.innerHTML += `
                        <div class="status-user ${checkedClass}">
                            <div class="status-user-top">
                                <div class="status-user-info-wrapper">
                                    <input type="checkbox" class="client-checkbox waiting-checkbox" data-id="${client.id}" ${isChecked}>
                                    <div class="status-user-info">
                                        <div class="status-user-name">${client.name}</div>
                                        ${client.link ? `<a href="${client.link}" target="_blank" class="status-user-link auto-check-link" data-id="${client.id}">${client.link}</a>` : ''}
                                    </div>
                                </div>
                                <div class="quick-actions">
                                    <button class="btn-quick-done" data-id="${client.id}" data-status="done">✅ done</button>
                                    <button class="btn-quick-no-tasks" data-id="${client.id}" data-status="no_tasks">🚫 بدون تاسكات</button>
                                    <button class="btn-quick-reject" data-id="${client.id}" data-status="reject">❌ reject</button>
                                </div>
                            </div>
                            ${client.notes ? `<div class="status-user-notes">${client.notes}</div>` : ''}
                        </div>
                    `;
                });
            }

            // تحديث العدادات
            document.getElementById('waitingCount').innerText = counts.waiting;
            document.getElementById('noTasksCount').innerText = counts.no_tasks;
            document.getElementById('doneCount').innerText = counts.done;
            document.getElementById('rejectCount').innerText = counts.reject;

            // رسائل للقوائم الفارغة
            Object.keys(containers).forEach(key => {
                if (counts[key] === 0) {
                    containers[key].innerHTML = '<div class="no-status-users">لا يوجد عملاء</div>';
                }
            });

            // ربط أزرار تحويل الحالة
            document.querySelectorAll('.quick-actions button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const newStatus = e.target.getAttribute('data-status');
                    updateStatus(id, newStatus);
                });
            });

            // ربط الـ Checkbox يدوي
            document.querySelectorAll('.waiting-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const isChecked = e.target.checked;
                    update(ref(db, `clients/${id}`), { checked: isChecked });
                });
            });

            // تحديد العميل تلقائياً عند الضغط على الرابط
            document.querySelectorAll('.auto-check-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    update(ref(db, `clients/${id}`), { checked: true });
                });
            });
        });

        // دالة تحديث حالة العميل
        function updateStatus(id, newStatus) {
            const itemRef = ref(db, `clients/${id}`);
            update(itemRef, { status: newStatus });
        }
    </script>

    <script>
        function toggleStatus(boxId) {
            const box = document.getElementById(boxId);
            box.classList.toggle('open');
        }
    </script>
</body>

</html>
