<body>


<div class="container">


    <h1>
        العملاء
    </h1>


    <!-- إضافة عميل -->

    <div class="add-box">

                id="clientName"
                placeholder="اسم العميل"
            >

        </div>


        <div class="form-row">

            <textarea
                id="clientNotes"
                placeholder="ملاحظات"
            ></textarea>

        </div>


        <button
            class="add-btn"
            id="addBtn"
        >
            إضافة العميل
        </button>

    </div>


    <!-- قائمة العملاء -->

    <div class="clients-box">

        <div class="clients-title">
            قائمة العملاء
        </div>


        <div id="clientsContainer">

            <div class="loading">
                جاري تحميل العملاء...
            </div>

        </div>

</div>



<script type="module">


/* =====================================================
   Firebase
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    update,
    remove
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";



/* =====================================================
   Firebase Config
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAB4wO937rCwc0OTWeJlGgoaxERWOdjaJM",

    authDomain:
        "my-new-a6e9f.firebaseapp.com",

    databaseURL:
        "https://my-new-a6e9f-default-rtdb.firebaseio.com",

    projectId:
        "my-new-a6e9f",

    storageBucket:
        "my-new-a6e9f.firebasestorage.app",

    messagingSenderId:
        "1034729064842",

    appId:
        "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"

};



/* تشغيل Firebase */

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);



/* =====================================================
   مسار العملاء
===================================================== */

const clientsRef =
    ref(db, "clients");


let clients = {};



/* =====================================================
   تحميل العملاء
===================================================== */

onValue(
    clientsRef,
    (snapshot) => {

        clients =
            snapshot.val() || {};

        displayClients();

    }
);



/* =====================================================
   إضافة عميل
===================================================== */

document
.getElementById("addBtn")
.addEventListener(
    "click",
    addClient
);


async function addClient() {

    const name =
        document
        .getElementById("clientName")
        .value
        .trim();


    const notes =
        document
        .getElementById("clientNotes")
        .value
        .trim();


    if (!name) {

        alert("اكتب اسم العميل أولاً");

        return;

    }


    try {

        const newClientRef =
            push(clientsRef);


        await set(
            newClientRef,
            {

                name: name,

                notes: notes,

                createdAt: Date.now()

            }
        );


        /* تنظيف الحقول */

        document
        .getElementById("clientName")
        .value = "";


        document
        .getElementById("clientNotes")
        .value = "";


    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء إضافة العميل:\n"
            + error.message
        );

    }

}



/* =====================================================
   عرض العملاء
===================================================== */

function displayClients() {

    const container =
        document.getElementById(
            "clientsContainer"
        );


    container.innerHTML = "";


    let entries =
        Object.entries(clients);


    if (entries.length === 0) {

        container.innerHTML = `

            <div class="empty">

                لا يوجد عملاء حتى الآن

            </div>

        `;

        return;

    }


    /* الأحدث أولاً */

    entries.sort((a, b) => {

        return (
            Number(b[1].createdAt || 0)
            -
            Number(a[1].createdAt || 0)
        );

    });


    entries.forEach(
        ([id, client]) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "client-card";


            card.dataset.id =
                id;


            card.innerHTML = `

                <div class="client-content">

                    <div class="client-name">

                        👤
                        ${escapeHTML(
                            client.name || ""
                        )}

                    </div>


                    ${
                        client.notes

                        ?

                        `<div class="client-notes">
                            ${escapeHTML(client.notes)}
                        </div>`

                        :

                        `<div class="client-notes">
                            لا توجد ملاحظات
                        </div>`
                    }

                </div>


                <div class="actions">

                    <button
                        class="edit-btn"
                        data-edit-id="${id}"
                    >
                        تعديل
                    </button>


                    <button
                        class="delete-btn"
                        data-delete-id="${id}"
                    >
                        حذف
                    </button>

                </div>

            `;


            container.appendChild(card);


            /* زر التعديل */

            const editButton =
                card.querySelector(
                    "[data-edit-id]"
                );


            editButton.addEventListener(
                "click",
                () => {

                    editClient(
                        id
                    );

                }
            );


            /* زر الحذف */

            const deleteButton =
                card.querySelector(
                    "[data-delete-id]"
                );


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteClient(
                        id
                    );

                }
            );

        }
    );

}



/* =====================================================
   تعديل العميل
===================================================== */

function editClient(id) {

    const client =
        clients[id];


    if (!client) {
        return;
    }


    const card =
        document.querySelector(
            `.client-card[data-id="${id}"]`
        );


    card.innerHTML = `

        <div class="edit-content">

            <input
                type="text"
                id="editName_${id}"
                value="${escapeAttribute(
                    client.name || ""
                )}"
                placeholder="اسم العميل"
            >


            <textarea
                id="editNotes_${id}"
                placeholder="ملاحظات"
            >${escapeHTML(
                client.notes || ""
            )}</textarea>


            <div class="edit-actions">

                <button
                    class="save-btn"
                    id="save_${id}"
                >
                    حفظ التعديل
                </button>


                <button
                    class="cancel-btn"
                    id="cancel_${id}"
                >
                    إلغاء
                </button>

            </div>

        </div>

    `;


    /* حفظ */

    document
    .getElementById(`save_${id}`)
    .addEventListener(
        "click",
        () => {

            saveClientEdit(id);

        }
    );


    /* إلغاء */

    document
    .getElementById(`cancel_${id}`)
    .addEventListener(
        "click",
        () => {

            displayClients();

        }
    );

}



/* =====================================================
   حفظ تعديل العميل
===================================================== */

async function saveClientEdit(id) {

    const name =
        document
        .getElementById(`editName_${id}`)
        .value
        .trim();


    const notes =
        document
        .getElementById(`editNotes_${id}`)
        .value
        .trim();


    if (!name) {

        alert("اكتب اسم العميل");

        return;

    }


    try {

        await update(
            ref(
                db,
                "clients/" + id
            ),
            {

                name: name,

                notes: notes

            }
        );


    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء حفظ التعديل:\n"
            + error.message
        );

    }

}



/* =====================================================
   حذف العميل
===================================================== */

async function deleteClient(id) {

    const client =
        clients[id];


    const name =
        client?.name || "هذا العميل";


    const confirmed =
        confirm(
            `هل تريد حذف العميل "${name}"؟`
        );


    if (!confirmed) {
        return;
    }


    try {

        await remove(
            ref(
                db,
                "clients/" + id
            )
        );


    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء حذف العميل:\n"
            + error.message
        );

    }

}



/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text ?? "");

    return div.innerHTML;

}



/* =====================================================
   حماية قيمة input
===================================================== */

function escapeAttribute(text) {

    return String(text ?? "")

        .replace(/&/g, "&amp;")

        .replace(/"/g, "&quot;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");

}


</script>


</body>

</html>
