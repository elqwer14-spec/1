<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العملاء والكامبينات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;
            color: #222;
        }

        /* ================= NAV ================= */

        .top-nav {
            background: #ffffff;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 1px solid #dce8f5;
            box-shadow: 0 2px 8px rgba(60, 120, 180, 0.08);
        }

        .top-nav a {
            color: #2878c8;
            text-decoration: none;
            background: #eef7ff;
            border: 1px solid #cfe7fb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .top-nav a:hover {
            background: #dcefff;
            color: #1764a8;
            border-color: #b9dbf5;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 950px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* ================= LOGIN BAR ================= */

        .login-bar {
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-right: 4px solid #2878c8;
        }

        .login-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }

        .login-select {
            padding: 8px 12px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
            min-width: 180px;
            background-color: #fff;
        }

        .btn-login {
            background: #2878c8;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #1764a8;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: none;
        }

        .user-status {
            font-size: 13px;
            font-weight: bold;
            color: #157347;
        }

        /* ================= SEARCH & ACTION BAR ================= */

        .action-bar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 14px;
        }

        .toggle-add-btn {
            background: #2878c8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        /* ================= FORM ================= */

        .form-box {
            display: none;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 1px 5px #dfe8f0;
            border: 2px solid #2878c8;
        }

        .form-box.open {
            display: block !important;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2878c8;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid #cddce9;
            border-radius: 6px;
            font-size: 13px;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #198754;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        /* ================= CAMPAIGNS SECTION ================= */

        .campaigns-container {
            margin-bottom: 20px;
        }

        .campaign-card {
            background: #ffffff;
            border: 2px solid #6f42c1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(111, 66, 193, 0.1);
        }

        .campaign-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .campaign-title {
            font-size: 16px;
            font-weight: bold;
            color: #6f42c1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .campaign-client-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            transition: 0.2s;
        }

        .campaign-client-item.visited {
            background-color: #e2f0d9;
            border-color: #b2d8a0;
        }

        .visit-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .visit-tag.visited {
            background: #198754;
            color: white;
        }

        .visit-tag.not-visited {
            background: #6c757d;
            color: white;
        }

        .btn-remove-from-campaign {
            background: #e2e8f0;
            color: #dc3545;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        /* ================= STATUS SUMMARY ================= */

        .status-summary {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 1px 5px #dfe8f0;
        }

        .status-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-summary-title {
            font-size: 18px;
            font-weight: bold;
            color: #2878c8;
        }

        .btn-add-campaign {
            background: #6f42c1;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .status-box {
            border: 1px solid #e1e8ef;
            border-radius: 7px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .status-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
        }

        .waiting-header { background: #fff8df; color: #856404; }
        .no-tasks-header { background: #e2e8f0; color: #334155; }
        .done-header { background: #e5f5ed; color: #176b48; }
        .reject-header { background: #fdebec; color: #842029; }

        .status-count {
            background: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .status-list {
            display: none;
            padding: 8px;
            background: #fff;
        }

        .status-box.open .status-list {
            display: block;
        }

        .status-user {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .status-user-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .client-link-text {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: #2878c8;
            word-break: break-all;
            text-decoration: underline;
        }

        .quick-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .quick-actions button {
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-quick-done { background: #198754; color: white; }
        .btn-quick-no-tasks { background: #64748b; color: white; }
        .btn-quick-reject { background: #dc3545; color: white; }
        .btn-quick-campaign { background: #6f42c1; color: white; }

        .no-status-users {
            color: #888;
            text-align: center;
            padding: 8px;
            font-size: 12px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: white;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        .btn-modal-confirm {
            background: #6f42c1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-modal-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- ================= NAV ================= -->
    <div class="top-nav">
        <a href="https://elqwer14-spec.github.io/1/1.html">Data_Entry_links_Users</a>
        <a href="https://elqwer14-spec.github.io/1/2.html">Data_Users</a>
        <a href="https://elqwer14-spec.github.io/1/3.html">Last_add</a>
        <a href="https://elqwer14-spec.github.io/1/4.html">Wallet</a>
        <a href="https://elqwer14-spec.github.io/1/5.html">Clients</a>
        <a href="https://elqwer14-spec.github.io/1/6.html">not_done_for_User</a>
        <a href="https://elqwer14-spec.github.io/1/7.html">last_login</a>
        <a href="https://elqwer14-spec.github.io/1/8.html">sereach</a>
        <a href="https://elqwer14-spec.github.io/1/9.html">User/ref</a>
        <a href="https://elqwer14-spec.github.io/1/10.html">code/rdp</a>
        <a href="https://elqwer14-spec.github.io/1/11.html">Chat</a>
        <a href="https://elqwer14-spec.github.io/1/12.html">sheet</a>
    </div>

    <div class="container">

        <!-- ================= LOGIN BAR ================= -->
        <div class="login-bar">
            <div class="login-controls">
                <label for="userSelect"><b>المستخدم:</b></label>
                <select id="userSelect" class="login-select">
                    <option value="">جاري تحميل المستخدمين...</option>
                </select>
                <button id="loginBtn" class="btn-login">تسجيل دخول</button>
                <button id="logoutBtn" class="btn-logout">تسجيل خروج</button>
            </div>
            <div id="userStatus" class="user-status">غير مسجل دخول (زائر)</div>
        </div>

        <!-- ================= SEARCH & ACTION BAR ================= -->
        <div class="action-bar" id="actionBar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث عن عميل...">
            <button class="toggle-add-btn" id="toggleAddBtn">➕ إضافة عميل جديد</button>
        </div>

        <!-- ================= ADD CLIENT (Form Box) ================= -->
        <div class="form-box" id="formBox">
            <div class="form-title">إضافة عميل جديد</div>
            <div class="form-group">
                <label>اسم العميل *</label>
                <input type="text" id="clientName" placeholder="اكتب اسم العميل">
            </div>
            <div class="form-group">
                <label>لينك العميل</label>
                <input type="text" id="clientLink" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label>الحالة</label>
                <select id="clientStatus">
                    <option value="waiting">⏳ على الانتظار</option>
                    <option value="no_tasks">🚫 بدون تاسكات</option>
                    <option value="done">✅ done</option>
                    <option value="reject">❌ reject</option>
                </select>
            </div>
            <div class="form-group">
                <label>ملاحظات</label>
                <textarea id="clientNotes" placeholder="اكتب ملاحظات..."></textarea>
            </div>
            <button class="add-btn" id="submitClientBtn">إضافة العميل</button>
        </div>

        <!-- ================= 1. STATUS SUMMARY ================= -->
        <div class="status-summary" id="statusSummarySection">
            <div class="status-summary-header">
                <div class="status-summary-title">حالات العملاء</div>
                <button class="btn-add-campaign" id="createCampaignBtn">➕ إضافة كامبين جديد</button>
            </div>

            <!-- قائمة الانتظار -->
            <div class="status-box" id="waitingBox">
                <div class="status-header waiting-header" onclick="toggleStatus('waitingBox')">
                    <span>⏳ على الانتظار</span>
                    <span class="status-count" id="waitingCount">0</span>
                </div>
                <div class="status-list" id="waitingList"><div id="waitingItems"></div></div>
            </div>

            <!-- قائمة بدون تاسكات -->
            <div class="status-box" id="noTasksBox">
                <div class="status-header no-tasks-header" onclick="toggleStatus('noTasksBox')">
                    <span>🚫 بدون تاسكات</span>
                    <span class="status-count" id="noTasksCount">0</span>
                </div>
                <div class="status-list" id="noTasksList"></div>
            </div>

            <!-- قائمة تم -->
            <div class="status-box" id="doneBox">
                <div class="status-header done-header" onclick="toggleStatus('doneBox')">
                    <span>✅ done</span>
                    <span class="status-count" id="doneCount">0</span>
                </div>
                <div class="status-list" id="doneList"></div>
            </div>

            <!-- قائمة مرفوض -->
            <div class="status-box" id="rejectBox">
                <div class="status-header reject-header" onclick="toggleStatus('rejectBox')">
                    <span>❌ reject</span>
                    <span class="status-count" id="rejectCount">0</span>
                </div>
                <div class="status-list" id="rejectList"></div>
            </div>
        </div>

        <!-- ================= 2. CAMPAIGNS SECTION ================= -->
        <div class="campaigns-container" id="campaignsContainer"></div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="campaignModal">
        <div class="modal-box">
            <div class="modal-title" style="font-weight:bold; color:#6f42c1; margin-bottom:10px;">🚀 اختر الكامبين لتحويل العميل إليه</div>
            <div class="form-group">
                <select id="modalCampaignSelect"></select>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:15px;">
                <button class="btn-modal-confirm" id="confirmAssignCampaignBtn">تأكيد</button>
                <button class="btn-modal-cancel" id="cancelAssignCampaignBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ================= FIREBASE & APP SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAB4wO937rCwc0OTWeJlGgoaxERWOdjaJM",
            authDomain: "my-new-a6e9f.firebaseapp.com",
            databaseURL: "https://my-new-a6e9f-default-rtdb.firebaseio.com",
            projectId: "my-new-a6e9f",
            storageBucket: "my-new-a6e9f.firebasestorage.app",
            messagingSenderId: "1034729064842",
            appId: "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const clientsRef = ref(db, 'clients');
        const usersRef = ref(db, 'users');
        const campaignsRef = ref(db, 'campaigns');

        let rawClientsData = null;
        let rawCampaignsData = null;
        let currentUser = localStorage.getItem('logged_user') || null;
        let selectedClientIdForCampaign = null;

        const userSelect = document.getElementById('userSelect');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userStatus = document.getElementById('userStatus');

        const actionBar = document.getElementById('actionBar');
        const formBox = document.getElementById('formBox');
        const statusSummarySection = document.getElementById('statusSummarySection');

        const statusNames = {
            'waiting': '⏳ على الانتظار',
            'no_tasks': '🚫 بدون تاسكات',
            'done': '✅ done',
            'reject': '❌ reject'
        };

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttribute(str) {
            if (!str) return '';
            return String(str).replace(/"/g, '&quot;');
        }

        window.toggleStatus = function(boxId) {
            const el = document.getElementById(boxId);
            if (el) el.classList.toggle('open');
        };

        function updateLoginUI() {
            if (currentUser) {
                userStatus.textContent = `مرحباً، ${currentUser}`;
                userSelect.style.display = 'none';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';

                actionBar.style.display = 'none';
                formBox.classList.remove('open');
                statusSummarySection.style.display = 'none';
            } else {
                userStatus.textContent = 'غير مسجل دخول (زائر)';
                userSelect.style.display = 'inline-block';
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';

                actionBar.style.display = 'flex';
                statusSummarySection.style.display = 'block';
            }
        }

        onValue(usersRef, (snapshot) => {
            const usersData = snapshot.val();
            userSelect.innerHTML = '<option value="">-- اختر مستخدم --</option>';
            if (usersData) {
                Object.keys(usersData).forEach(id => {
                    const u = usersData[id];
                    const userName = typeof u === 'string' ? u : (u.name || u.username || id);
                    const opt = document.createElement('option');
                    opt.value = userName;
                    opt.textContent = userName;
                    userSelect.appendChild(opt);
                });
            }
            updateLoginUI();
        });

        loginBtn.addEventListener('click', () => {
            const selected = userSelect.value;
            if (!selected) {
                alert('يرجى اختيار اسم مستخدم من القائمة');
                return;
            }
            currentUser = selected;
            localStorage.setItem('logged_user', currentUser);
            updateLoginUI();
            renderAll();
        });

        logoutBtn.addEventListener('click', () => {
            if (rawClientsData) {
                Object.keys(rawClientsData).forEach(clientId => {
                    if (rawClientsData[clientId].visited) {
                        update(ref(db, `clients/${clientId}`), { visited: false });
                    }
                });
            }

            currentUser = null;
            localStorage.removeItem('logged_user');
            updateLoginUI();
            renderAll();
        });

        const toggleAddBtn = document.getElementById('toggleAddBtn');
        toggleAddBtn.addEventListener('click', () => {
            formBox.classList.toggle('open');
        });

        // ================= زر الإضافة المعدل والمصلح =================
        document.getElementById('submitClientBtn').addEventListener('click', () => {
            const nameInput = document.getElementById('clientName');
            const linkInput = document.getElementById('clientLink');
            const statusInput = document.getElementById('clientStatus');
            const notesInput = document.getElementById('clientNotes');

            const name = nameInput.value.trim();
            const link = linkInput.value.trim();
            const status = statusInput.value;
            const notes = notesInput.value.trim();

            if (!name) {
                alert('يرجى إدخال اسم العميل');
                return;
            }

            // فحص التكرارات في البيانات الموجودة
            if (rawClientsData) {
                const normalizedNewName = name.toLowerCase();
                const normalizedNewLink = link ? link.toLowerCase().replace(/\/+$/, '') : '';

                for (const id in rawClientsData) {
                    const client = rawClientsData[id];
                    const existingName = client.name ? client.name.trim().toLowerCase() : '';
                    const existingLink = client.link ? client.link.trim().toLowerCase().replace(/\/+$/, '') : '';
                    const clientStatusText = statusNames[client.status] || client.status || 'غير محددة';

                    if (existingName === normalizedNewName) {
                        alert(`⚠️ خطأ: العميل "${client.name}" مضاف بالفعل مسبقاً وبحالة: (${clientStatusText})`);
                        return;
                    }

                    if (normalizedNewLink && existingLink && existingLink === normalizedNewLink) {
                        alert(`⚠️ خطأ: لينك العميل مضاف بالفعل مسبقاً مع العميل "${client.name}" وبحالة: (${clientStatusText})`);
                        return;
                    }
                }
            }

            // حفظ العميل في داتابيز Firebase
            push(clientsRef, {
                name: name,
                link: link,
                status: status,
                notes: notes,
                visited: false,
                addedBy: currentUser || 'زائر',
                createdAt: Date.now()
            }).then(() => {
                nameInput.value = '';
                linkInput.value = '';
                notesInput.value = '';
                formBox.classList.remove('open');
                alert('✅ تم إضافة العميل بنجاح');
            }).catch((err) => {
                alert('حدث خطأ أثناء الإضافة: ' + err.message);
            });
        });

        document.getElementById('createCampaignBtn').addEventListener('click', () => {
            const campaignName = prompt("أدخل اسم الكامبين الجديد:");
            if (campaignName && campaignName.trim()) {
                push(campaignsRef, { name: campaignName.trim(), createdAt: Date.now() });
            }
        });

        onValue(campaignsRef, (snapshot) => {
            rawCampaignsData = snapshot.val();
            renderAll();
        });

        onValue(clientsRef, (snapshot) => {
            rawClientsData = snapshot.val();
            renderAll();
        });

        document.getElementById('searchInput').addEventListener('input', renderAll);

        function renderAll() {
            renderCampaigns(rawCampaignsData, rawClientsData);
            renderClients(rawClientsData);
        }

        function renderCampaigns(campaigns, clients) {
            const container = document.getElementById('campaignsContainer');
            container.innerHTML = '';

            if (!campaigns) return;

            Object.keys(campaigns).forEach(cId => {
                const campaign = campaigns[cId];
                let clientsHTML = '';
                let count = 0;

                if (clients) {
                    Object.keys(clients).forEach(clientId => {
                        const client = clients[clientId];
                        if (client.campaignId === cId) {
                            count++;
                            const isVisited = client.visited === true;

                            clientsHTML += `
                                <div class="campaign-client-item ${isVisited ? 'visited' : ''}">
                                    <div>
                                        <strong>${escapeHTML(client.name)}</strong>
                                        ${client.link ? `<a href="${escapeAttribute(client.link)}" target="_blank" class="client-link-action client-link-text" data-id="${clientId}">${escapeHTML(client.link)}</a>` : ''}
                                    </div>
                                    <div style="display:flex; align-items:center; gap:8px;">
                                        <button class="visit-toggle-btn visit-tag ${isVisited ? 'visited' : 'not-visited'}" data-id="${clientId}" style="border:none; cursor:pointer;">
                                            ${isVisited ? 'تم الدخول 👁️' : 'لم يتم الدخول ❌'}
                                        </button>
                                        ${!currentUser ? `<button class="btn-remove-from-campaign" data-id="${clientId}">إزالة ✖</button>` : ''}
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                if (count === 0) {
                    clientsHTML = '<div class="no-status-users">لا يوجد عملاء داخل هذا الكامبين حالياً</div>';
                }

                container.innerHTML += `
                    <div class="campaign-card">
                        <div class="campaign-header">
                            <div class="campaign-title">
                                <span>🎯 ${escapeHTML(campaign.name)}</span>
                                <span class="status-count">${count}</span>
                            </div>
                        </div>
                        <div>${clientsHTML}</div>
                    </div>
                `;
            });

            document.querySelectorAll('.visit-toggle-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id && rawClientsData && rawClientsData[id]) {
                        const current = rawClientsData[id].visited || false;
                        update(ref(db, `clients/${id}`), { visited: !current });
                    }
                });
            });

            document.querySelectorAll('.client-link-action').forEach(a => {
                a.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) {
                        update(ref(db, `clients/${id}`), { visited: true });
                    }
                });
            });

            document.querySelectorAll('.btn-remove-from-campaign').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (id) {
                        update(ref(db, `clients/${id}`), { campaignId: null });
                    }
                });
            });
        }

        function renderClients(clients) {
            const filter = document.getElementById('searchInput').value.trim().toLowerCase();

            const items = {
                waiting: [],
                no_tasks: [],
                done: [],
                reject: []
            };

            if (clients) {
                Object.keys(clients).forEach(id => {
                    const client = clients[id];
                    client.id = id;

                    if (filter) {
                        const matchName = client.name && client.name.toLowerCase().includes(filter);
                        const matchNotes = client.notes && client.notes.toLowerCase().includes(filter);
                        if (!matchName && !matchNotes) return;
                    }

                    const st = client.status || 'waiting';
                    if (items[st]) {
                        items[st].push(client);
                    }
                });
            }

            document.getElementById('waitingCount').textContent = items.waiting.length;
            document.getElementById('noTasksCount').textContent = items.no_tasks.length;
            document.getElementById('doneCount').textContent = items.done.length;
            document.getElementById('rejectCount').textContent = items.reject.length;

            renderStatusList('waitingItems', items.waiting);
            renderStatusList('noTasksList', items.no_tasks);
            renderStatusList('doneList', items.done);
            renderStatusList('rejectList', items.reject);
        }

        function renderStatusList(containerId, list) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<div class="no-status-users">لا يوجد عملاء</div>';
                return;
            }

            list.forEach(client => {
                container.innerHTML += `
                    <div class="status-user">
                        <div class="status-user-top">
                            <div>
                                <strong>${escapeHTML(client.name)}</strong>
                                ${client.link ? `<a href="${escapeAttribute(client.link)}" target="_blank" class="client-link-text">${escapeHTML(client.link)}</a>` : ''}
                            </div>
                            <div class="quick-actions">
                                <button class="btn-quick-done" data-id="${client.id}" data-status="done">✅ done</button>
                                <button class="btn-quick-no-tasks" data-id="${client.id}" data-status="no_tasks">🚫 بدون تاسكات</button>
                                <button class="btn-quick-reject" data-id="${client.id}" data-status="reject">❌ reject</button>
                                <button class="btn-quick-campaign" data-id="${client.id}">🚀 تحويل لكامبين</button>
                            </div>
                        </div>
                        ${client.notes ? `<div style="font-size:12px; color:#666; margin-top:6px;">📝 ${escapeHTML(client.notes)}</div>` : ''}
                    </div>
                `;
            });

            container.querySelectorAll('button[data-status]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const status = e.target.getAttribute('data-status');
                    update(ref(db, `clients/${id}`), { status });
                });
            });

            container.querySelectorAll('.btn-quick-campaign').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    selectedClientIdForCampaign = e.target.getAttribute('data-id');
                    openCampaignModal();
                });
            });
        }

        const campaignModal = document.getElementById('campaignModal');
        const modalCampaignSelect = document.getElementById('modalCampaignSelect');

        function openCampaignModal() {
            modalCampaignSelect.innerHTML = '';
            if (rawCampaignsData) {
                Object.keys(rawCampaignsData).forEach(cId => {
                    const opt = document.createElement('option');
                    opt.value = cId;
                    opt.textContent = rawCampaignsData[cId].name;
                    modalCampaignSelect.appendChild(opt);
                });
            }
            campaignModal.classList.add('open');
        }

        document.getElementById('cancelAssignCampaignBtn').addEventListener('click', () => {
            campaignModal.classList.remove('open');
            selectedClientIdForCampaign = null;
        });

        document.getElementById('confirmAssignCampaignBtn').addEventListener('click', () => {
            const campaignId = modalCampaignSelect.value;
            if (selectedClientIdForCampaign && campaignId) {
                update(ref(db, `clients/${selectedClientIdForCampaign}`), { campaignId }).then(() => {
                    campaignModal.classList.remove('open');
                    selectedClientIdForCampaign = null;
                });
            }
        });
    </script>
</body>

</html>
