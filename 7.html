<style>

body {

<body>

<div class="container">

    <div class="box">

        <h1>
            👤 آخر ظهور المستخدمين

        <!-- اختيار التاريخ -->

        <div class="filter-box">

            <div class="filter-title">
                تحديد التاريخ

                    type="date"

                >

                <button
                    class="clear-btn"
                    id="clearDate"
                >
                    الكل
                </button>

        <!-- عدد المستخدمين -->

            id="userCount"
        >
            جاري تحميل المستخدمين...

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAB4wO937rCwc0OTWeJlGgoaxErWOdjaJM",

    authDomain:
        "my-new-a6e9f.firebaseapp.com",

    databaseURL:
        "https://my-new-a6e9f-default-rtdb.firebaseio.com",

    projectId:
        "my-new-a6e9f",

    storageBucket:
        "my-new-a6e9f.firebasestorage.app",

    messagingSenderId:
        "1034729064842",

    appId:
        "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


/* =========================
   المتغيرات
========================= */

let loginHistory = {};


/* =========================
   تحميل سجل الدخول
========================= */

const loginHistoryRef =
    ref(db, "loginHistory");


onValue(
    loginHistoryRef,
    snapshot => {

        loginHistory =
            snapshot.val() || {};

        displayUsers();

    },
    error => {

        console.error(
            "Firebase Error:",
            error
        );

        document.getElementById(
            "userContainer"
        ).innerHTML = `
            <div class="no-user">
                حدث خطأ أثناء تحميل المستخدمين
            </div>
        `;

    }
);


/* =========================
   اختيار التاريخ
========================= */

document
    .getElementById("dateFilter")
    .addEventListener(
        "change",
        displayUsers
    );


/* =========================
   زر الكل
========================= */

document
    .getElementById("clearDate")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("dateFilter")
                .value = "";

            displayUsers();

        }
    );


/* =========================
   تحويل التاريخ إلى YYYY-MM-DD
========================= */

function getLocalDate(timestamp) {

    const date =
        new Date(
            Number(timestamp)
        );

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


/* =========================
   عرض المستخدمين
========================= */

function displayUsers() {

    const container =
        document.getElementById(
            "userContainer"
        );


    const countElement =
        document.getElementById(
            "userCount"
        );


    container.innerHTML = "";


    const selectedDate =
        document
            .getElementById("dateFilter")
            .value;


    /*
       تحويل Firebase إلى Array
    */

    let records =
        Object.values(
            loginHistory
        );


    /*
       إزالة البيانات غير الصحيحة
    */

    records =
        records.filter(
            record => {

                return (
                    record &&
                    record.username &&
                    record.loginTime
                );

            }
        );


    /*
       لو مفيش تسجيلات
    */

    if (records.length === 0) {

        countElement.innerHTML =
            "عدد المستخدمين: <b>0</b>";

        container.innerHTML = `
            <div class="no-user">
                لا يوجد مستخدم سجل دخول حتى الآن
            </div>
        `;

        return;

    }


    /*
       ترتيب كل تسجيلات الدخول
       من الأحدث إلى الأقدم
    */

    records.sort(
        (a, b) => {

            return (
                Number(b.loginTime) -
                Number(a.loginTime)
            );

        }
    );


    /*
       ==================================
       لو تم اختيار تاريخ
       ==================================
    */

    if (selectedDate) {

        /*
           نأخذ فقط تسجيلات الدخول
           الخاصة بهذا اليوم
        */

        records =
            records.filter(
                record => {

                    return (
                        getLocalDate(
                            record.loginTime
                        ) === selectedDate
                    );

                }
            );


        /*
           الآن نأخذ آخر تسجيل
           لكل مستخدم في هذا اليوم
        */

        const usersByDate = {};


        records.forEach(
            record => {

                const userKey =
                    record.userKey ||
                    makeUserKey(
                        record.username
                    );


                /*
                   لأن records مرتبة
                   من الأحدث للأقدم

                   أول تسجيل للمستخدم
                   = آخر تسجيل له في اليوم
                */

                if (
                    !usersByDate[userKey]
                ) {

                    usersByDate[userKey] =
                        record;

                }

            }
        );


        let users =
            Object.values(
                usersByDate
            );


        /*
           ترتيب الأحدث أولاً
        */

        users.sort(
            (a, b) => {

                return (
                    Number(b.loginTime) -
                    Number(a.loginTime)
                );

            }
        );


        countElement.innerHTML =
            `عدد المستخدمين في هذا اليوم:
             <b>${users.length}</b>`;


        if (users.length === 0) {

            container.innerHTML = `
                <div class="no-user">
                    لا يوجد مستخدمون سجلوا الدخول في هذا التاريخ
                </div>
            `;

            return;

        }


        renderUsers(users);

        return;

    }


    /*
       ==================================
       بدون اختيار تاريخ
       ==================================
    */

    /*
       نأخذ آخر تسجيل دخول
       لكل مستخدم على الإطلاق
    */

    const latestUsers = {};


    records.forEach(
        record => {

            const userKey =
                record.userKey ||
                makeUserKey(
                    record.username
                );


            /*
               بما أن البيانات مرتبة
               من الأحدث للأقدم

               أول تسجيل للمستخدم
               هو آخر ظهور له
            */

            if (
                !latestUsers[userKey]
            ) {

                latestUsers[userKey] =
                    record;

            }

        }
    );


    let users =
        Object.values(
            latestUsers
        );


    /*
       ترتيب المستخدمين
       من آخر واحد سجل دخول
       إلى الأقدم
    */

    users.sort(
        (a, b) => {

            return (
                Number(b.loginTime) -
                Number(a.loginTime)
            );

        }
    );


    countElement.innerHTML =
        `عدد المستخدمين:
         <b>${users.length}</b>`;


    renderUsers(users);

}


/* =========================
   إنشاء المستخدمين في الصفحة
========================= */

function renderUsers(users) {

    const container =
        document.getElementById(
            "userContainer"
        );


    container.innerHTML = "";


    users.forEach(
        (user, index) => {

            const date =
                new Date(
                    Number(
                        user.loginTime
                    )
                );


            const onlyDate =
                date.toLocaleDateString(
                    "ar-EG"
                );


            const onlyTime =
                date.toLocaleTimeString(
                    "ar-EG"
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "user";


            div.innerHTML = `

                <div class="number">
                    ${index + 1}
                </div>


                <div>

                    <div class="username">
                        ${escapeHTML(
                            user.username
                        )}
                    </div>


                    <div class="time">

                        آخر تسجيل دخول:

                        <span class="time-date">
                            ${escapeHTML(
                                onlyDate
                            )}
                        </span>

                        -

                        ${escapeHTML(
                            onlyTime
                        )}

                    </div>

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =========================
   إنشاء User Key
========================= */

function makeUserKey(username) {

    return username
        .trim()
        .toLowerCase()
        .replace(
            /[.#$[\]/]/g,
            "_"
        )
        .replace(
            /\s+/g,
            "_"
        );

}


/* =========================
   حماية HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            text ?? ""
        );


    return div.innerHTML;

}

</script>
