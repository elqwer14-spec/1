<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد ألقاب وأسماء مستخدمين ضخم (+1000)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #34495e;
        }

        select, input, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 14px;
            outline: none;
        }

        .btn-generate {
            background-color: #27ae60;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-generate:hover {
            background-color: #219150;
        }

        .btn-copy-all {
            background-color: #2980b9;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy-all:hover {
            background-color: #1f6391;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            max-height: 550px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
        }

        .user-card {
            background: #ffffff;
            border: 1px solid #dcdde1;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: center;
            font-family: monospace;
            font-size: 13px;
            color: #2f3640;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            word-break: break-all;
        }

        .user-card:hover {
            background-color: #e1b12c;
            color: white;
            border-color: #e1b12c;
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎯 مولد الأسماء لـ +1000 يوزر مختلف</h1>
        <p class="subtitle">اضغط على أي يوزر لنسخه وحذفه فوراً بشكل صامت بدون أرقام أو رسائل</p>

        <!-- أدوات التحكم -->
        <div class="controls">
            <div class="control-group">
                <label>نوع الأسماء:</label>
                <select id="nameType">
                    <option value="arabic">أسماء عربية (English/Franco)</option>
                    <option value="foreign">أسماء أجنبية (Foreign)</option>
                    <option value="mixed" selected>مزيج شاسع (عربي + أجنبي)</option>
                </select>
            </div>

            <div class="control-group">
                <label>العدد المطلوب (حتى 2000):</label>
                <input type="number" id="userCount" value="1000" min="10" max="2000">
            </div>

            <button class="btn-generate" id="generateBtn">توليد اليوزرات 🚀</button>
            <button class="btn-copy-all" id="copyAllBtn">نسخ المتبقي بالكامل 📋</button>
        </div>

        <!-- شريط الإحصائيات -->
        <div class="stats-bar">
            <span>اليوزرات المتبقية: <strong id="remainingCount" style="color:#e74c3c;">0</strong></span>
            <span style="font-size: 12px; color: #7f8c8d;">💡 نقرة واحدة = نسخ + حذف فوري</span>
        </div>

        <!-- شبكة عرض اليوزرات -->
        <div class="users-grid" id="usersGrid"></div>
    </div>

    <script>
        // مصفوفة ضخمة جداً للألقاب والأسماء الأولى لتفادي التكرار
        const arabicFirst = [
            "mohamed", "ahmed", "mahmoud", "youssef", "ali", "hassan", "hussein", "omar", "khalid", 
            "tarek", "samy", "mostafa", "ehab", "zeyad", "hamza", "karim", "amr", "walid", "yasser", 
            "amjad", "fady", "ramy", "osama", "hany", "moustafa", "sayed", "sherif", "wael", "ziad",
            "bassam", "tamer", "hazem", "maged", "ismail", "ashraf", "mounir", "alaa", "saad", "eslam",
            "khaled", "adham", "seif", "marwan", "ziyad", "salah", "yassin", "ayman", "mohab", "riad",
            "nader", "saber", "حاتم", "hatem", "tamim", "medhat", "shady", "hisham", "gamal", "farouk",
            "faysal", "badr", "rafeek", "monir", "samir", "emad", "atef", "sami", "magdy", "akram"
        ];
        
        const arabicLast = [
            "ahmed", "ali", "hassan", "ibrahim", "mahmoud", "osman", "salah", "fawzy", "kamal", 
            "saad", "zaki", "farouk", "elmofty", "ashraf", "nabil", "sami", "fouad", "magdy", "helmy",
            "amer", "mansour", "morsy", "badawy", "zahran", "khalil", "shaban", "elkotb", "kassab", "moustafa"
        ];

        const foreignFirst = [
            "john", "alex", "david", "michael", "james", "robert", "william", "daniel", "thomas", 
            "matthew", "george", "steven", "edward", "brian", "kevin", "jason", "ryan", "eric", 
            "adam", "oliver", "jack", "harry", "jacob", "charlie", "leo", "noah", "ethan", "lucas",
            "mason", "logan", "dylan", "caleb", "nathan", "carter", "luke", "henry", "owen", "wyatt",
            "sebastian", "jack", "julian", "levi", "isaac", "gabriel", "anthony", "dylan", "samuel", "johnny",
            "mark", "paul", "andrew", "joshua", "kenneth", "kevin", "brian", "george", "timothy", "ronald"
        ];

        const foreignLast = [
            "smith", "johnson", "williams", "brown", "jones", "miller", "davis", "wilson", "taylor", 
            "clark", "white", "harris", "martin", "jackson", "thompson", "wood", "watson", "baker",
            "green", "hall", "king", "wright", "scott", "torres", "nguyen", "hill", "flores", "king"
        ];

        let currentUsers = [];

        // إضافة حرف مكرر عشوائي كبديل لتنويع النمط عند الحاجه
        function addCharVariant(str) {
            if (Math.random() > 0.5) return str;
            const idx = Math.floor(Math.random() * (str.length - 1)) + 1;
            return str.slice(0, idx) + str[idx] + str.slice(idx);
        }

        // تطبيق التنسيق والتنوع بالأحرف بدون حروف كابيتال كاملة
        function formatUsername(first, last) {
            const separators = ['', '-', '_'];
            const sep = separators[Math.floor(Math.random() * separators.length)];

            const styles = ['lowercase', 'firstUpperBoth', 'firstUpperOnly', 'secondUpperOnly'];
            const style = styles[Math.floor(Math.random() * styles.length)];

            let f = first.toLowerCase();
            let l = last.toLowerCase();

            if (style === 'firstUpperBoth') {
                f = f.charAt(0).toUpperCase() + f.slice(1);
                l = l.charAt(0).toUpperCase() + l.slice(1);
            } else if (style === 'firstUpperOnly') {
                f = f.charAt(0).toUpperCase() + f.slice(1);
            } else if (style === 'secondUpperOnly') {
                l = l.charAt(0).toUpperCase() + l.slice(1);
            }

            return f + sep + l;
        }

        function generateUsers() {
            const count = parseInt(document.getElementById('userCount').value) || 1000;
            const type = document.getElementById('nameType').value;

            const generatedSet = new Set();
            currentUsers = [];

            let fPool = [];
            let lPool = [];

            if (type === 'arabic') {
                fPool = [...arabicFirst];
                lPool = [...arabicLast];
            } else if (type === 'foreign') {
                fPool = [...foreignFirst];
                lPool = [...foreignLast];
            } else {
                fPool = [...arabicFirst, ...foreignFirst];
                lPool = [...arabicLast, ...foreignLast];
            }

            let attempts = 0;
            while (generatedSet.size < count && attempts < count * 10) {
                attempts++;
                
                let f = fPool[Math.floor(Math.random() * fPool.length)];
                let l = lPool[Math.floor(Math.random() * lPool.length)];

                // إمكانية تنويع الحروف للحصول على تشكيلات هائلة بدون أرقام
                if (Math.random() > 0.6) f = addCharVariant(f);
                if (Math.random() > 0.7) l = addCharVariant(l);

                const username = formatUsername(f, l);

                if (!generatedSet.has(username)) {
                    generatedSet.add(username);
                }
            }

            currentUsers = Array.from(generatedSet);
            renderUsers();
        }

        function renderUsers() {
            const grid = document.getElementById('usersGrid');
            const remainingCountEl = document.getElementById('remainingCount');
            
            grid.innerHTML = '';
            remainingCountEl.textContent = currentUsers.length;

            currentUsers.forEach((user, index) => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.textContent = user;
                
                card.addEventListener('click', () => {
                    copyAndRemoveUser(user, index);
                });

                grid.appendChild(card);
            });
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        function copyAndRemoveUser(userText, index) {
            copyToClipboard(userText);
            currentUsers.splice(index, 1);
            renderUsers();
        }

        document.getElementById('copyAllBtn').addEventListener('click', () => {
            if (currentUsers.length === 0) return;
            const textToCopy = currentUsers.join('\n');
            copyToClipboard(textToCopy);
        });

        document.getElementById('generateBtn').addEventListener('click', generateUsers);

        // توليد تلقائي لـ 1000 يوزر فور فتح الصفحة
        generateUsers();
    </script>

</body>
</html>
