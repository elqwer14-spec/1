<div class="container">

        id="totalUsers"
    >
        إجمالي المستخدمين: 0

        class="loading"
    >

</div>



<script type="module">


/* =====================================================
   Firebase
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    remove
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";



/* =====================================================
   Firebase Config
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAB4wO937rCwc0OTWeJlGgoaxERWOdjaJM",

    authDomain:
        "my-new-a6e9f.firebaseapp.com",

    databaseURL:
        "https://my-new-a6e9f-default-rtdb.firebaseio.com",

    projectId:
        "my-new-a6e9f",

    storageBucket:
        "my-new-a6e9f.firebasestorage.app",

    messagingSenderId:
        "1034729064842",

    appId:
        "1:1034729064842:web:5b3d42fe7b5c0f3a3ae073"

};



/* تشغيل Firebase */

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);



/* =====================================================
   البيانات
===================================================== */

let users = {};

let links = {};


/*
   نحفظ المستخدمين الذين قاموا بفتح
   اللينكات الخاصة بهم حالياً

   حتى لا تختفي عند تحديث البيانات
*/

let openedUsers = {};



/* =====================================================
   تحميل المستخدمين
===================================================== */

onValue(
    ref(db, "users"),
    (snapshot) => {

        users =
            snapshot.val() || {};

        displayUsers();

    }
);



/* =====================================================
   تحميل اللينكات
===================================================== */

onValue(
    ref(db, "links"),
    (snapshot) => {

        links =
            snapshot.val() || {};

        displayUsers();

    }
);



/* =====================================================
   عرض المستخدمين
===================================================== */

function displayUsers() {


    const container =
        document.getElementById(
            "usersContainer"
        );


    const totalUsers =
        document.getElementById(
            "totalUsers"
        );


    container.innerHTML = "";


    const userEntries =
        Object.entries(users);


    totalUsers.innerHTML =

        `إجمالي المستخدمين:
        <b>${userEntries.length}</b>`;


    if (userEntries.length === 0) {

        container.innerHTML = `

            <div class="empty">

                لا يوجد مستخدمين حتى الآن

            </div>

        `;

        return;

    }



    /* =================================================
       كل مستخدم
    ================================================= */

    userEntries.forEach(
        ([userId, user]) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "user-card";


            const visited =
                user.visited || {};


            const visitedIds =
                Object.keys(visited);


            let linksHTML = "";


            if (
                visitedIds.length === 0
            ) {

                linksHTML = `

                    <div class="no-links">

                        ⚪ المستخدم لم يدخل
                        على أي لينك حتى الآن

                    </div>

                `;

            }

            else {


                visitedIds.forEach(
                    (linkId, index) => {


                        const link =
                            links[linkId];


                        if (!link) {
                            return;
                        }


                        const title =
                            link.name
                            ||
                            link.url
                            ||
                            "لينك بدون اسم";


                        linksHTML += `

                            <div
                                class="link-item"
                            >

                                <div
                                    class="link-number"
                                >
                                    ${index + 1}
                                </div>


                                <div>

                                    <div>

                                        ${escapeHTML(title)}

                                    </div>


                                    ${
                                        link.url

                                        ?

                                        `<a
                                            href="${escapeHTML(link.url)}"
                                            target="_blank"
                                            rel="noopener"
                                        >
                                            ${escapeHTML(link.url)}
                                        </a>`

                                        :

                                        ""
                                    }

                                </div>

                            </div>

                        `;

                    }
                );

            }



            /* =================================================
               بطاقة المستخدم
            ================================================= */


            card.innerHTML = `

                <div class="user-header">


                    <div class="username">

                        👤

                        ${escapeHTML(
                            user.username
                            ||
                            userId
                        )}

                    </div>


                    <div class="header-left">


                        <!-- سهم إظهار اللينكات -->

                        <button
                            class="toggle-links-btn
                            ${openedUsers[userId] ? "open" : ""}"
                            data-toggle-user="${userId}"
                            title="إظهار اللينكات"
                        >

                            <span class="arrow">
                                ▶
                            </span>

                        </button>


                        <div class="count">

                            دخل على
                            ${visitedIds.length}
                            لينك

                        </div>


                        <button
                            class="delete-user-btn"
                            data-user-id="${userId}"
                        >

                            حذف المستخدم

                        </button>


                    </div>

                </div>


                <!-- اللينكات مخفية افتراضياً -->

                <div
                    class="user-body
                    ${openedUsers[userId] ? "open" : ""}"
                >

                    <div class="link-title">

                        اللينكات التي دخل عليها:

                    </div>


                    ${linksHTML}

                </div>

            `;



            /* =================================================
               زر إظهار وإخفاء اللينكات
            ================================================= */

            const toggleButton =
                card.querySelector(
                    "[data-toggle-user]"
                );


            toggleButton.addEventListener(
                "click",
                () => {

                    toggleUserLinks(
                        userId,
                        card
                    );

                }
            );



            /* =================================================
               زر الحذف
            ================================================= */

            const deleteButton =
                card.querySelector(
                    "[data-user-id]"
                );


            deleteButton.addEventListener(
                "click",
                () => {

                    deleteUser(userId);

                }
            );



            container.appendChild(card);

        }
    );

}



/* =====================================================
   فتح / إغلاق لينكات المستخدم
===================================================== */

function toggleUserLinks(
    userId,
    card
) {


    const body =
        card.querySelector(
            ".user-body"
        );


    const button =
        card.querySelector(
            ".toggle-links-btn"
        );


    const isOpen =
        body.classList.contains("open");


    if (isOpen) {

        body.classList.remove("open");

        button.classList.remove("open");

        openedUsers[userId] = false;

    }

    else {

        body.classList.add("open");

        button.classList.add("open");

        openedUsers[userId] = true;

    }

}



/* =====================================================
   حذف مستخدم
===================================================== */

async function deleteUser(userId) {


    const user =
        users[userId];


    const username =
        user?.username || userId;


    const confirmed =
        confirm(

            `هل أنت متأكد من حذف المستخدم "${username}"؟\n\n`

            +

            `سيتم حذف المستخدم وسجل اللينكات التي دخل عليها.`

        );


    if (!confirmed) {

        return;

    }


    try {


        await remove(

            ref(
                db,
                "users/" + userId
            )

        );


        /*
           إزالة حالة فتح المستخدم
        */

        delete openedUsers[userId];


        alert(
            "تم حذف المستخدم بنجاح"
        );


    }

    catch (error) {


        console.error(error);


        alert(

            "حدث خطأ أثناء حذف المستخدم:\n"

            +

            error.message

        );

    }

}



/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(text) {


    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


</script>


</body>

</html>
