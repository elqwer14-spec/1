    onValue

} from

    appId:

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const linksRef =
    ref(db, "links");


/*
   مراقبة Firebase

   كلما أضيف لينك جديد
   الصفحة تتحدث تلقائياً
*/

onValue(linksRef, (snapshot) => {

    const links =
        snapshot.val() || {};

    displayLastLink(links);

});


function displayLastLink(links) {

    const container =
        document.getElementById("lastLink");


    container.innerHTML = "";


    const entries =
        Object.entries(links);


    if (entries.length === 0) {

        container.innerHTML = `

            <div class="empty">

                لا توجد لينكات حالياً

            </div>

        `;

        return;

    }


    /*
       البحث عن أحدث لينك
       باستخدام createdAt
    */

    entries.sort((a, b) => {

        return (
            Number(b[1].createdAt || 0) -
            Number(a[1].createdAt || 0)
        );

    });


    const latest =
        entries[0];


    const linkId =
        latest[0];


    const item =
        latest[1];


    let html = `

        <div class="link-card">

            <div class="link-number">

                آخر إضافة

            </div>

    `;


    if (item.name) {

        html += `

            <div class="link-name">

                ${escapeHTML(item.name)}

            </div>

        `;

    }


    if (item.url) {

        html += `

            <div class="link-url">

                <a
                    href="${escapeHTML(item.url)}"
                    target="_blank"
                    rel="noopener"
                >

                    ${escapeHTML(item.url)}

                </a>

            </div>

        `;

    }


    if (
        item.price !== null &&
        item.price !== undefined &&
        item.price !== ""
    ) {

        html += `

            <div class="link-price">

                السعر:
                ${escapeHTML(item.price)}

            </div>

        `;

    }


    if (
        item.order !== null &&
        item.order !== undefined &&
        item.order !== ""
    ) {

        html += `

            <div class="link-order">

                رقم الترتيب:
                ${escapeHTML(item.order)}

            </div>

        `;

    }


    if (item.notes) {

        html += `

            <div class="link-notes">

                ملاحظات:
                ${escapeHTML(item.notes)}

            </div>

        `;

    }


    if (item.createdAt) {

        const date =
            new Date(item.createdAt);


        html += `

            <div class="time">

                تمت الإضافة:
                ${date.toLocaleString("ar-EG")}

            </div>

        `;

    }


    html += `

        </div>

    `;


    container.innerHTML = html;

}


/* حماية النص */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text ?? "");

    return div.innerHTML;

}

</script>
